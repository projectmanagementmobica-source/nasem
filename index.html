    return `${greet}${yaName}.${agenda ? " " + agenda : " تحب نعمل إيه النهاردة؟"}`;
  }
  if (/^(شكرا|شكراً|متشكر|متشكرين|تسلم|تسلم ايدك|تسلم إيدك|ميرسي|thanks|thank you)( يا نسيم)?( جدا| جداً| أوي)?$/i.test(t))
    return pickOne(["العفو، أي وقت.", "تحت أمرك.", "ولا يهمك، أنا هنا."]);
  // prayer times (computed on the phone)
  const pm = t.match(/(الفجر|الضهر|الظهر|العصر|المغرب|العشا|العشاء)\s*(امتى|إمتى|الساعة كام|الساعه كام|كام)?/);
  if (pm && /(امتى|إمتى|كام|مواعيد|مواقيت)/.test(t)){
    const map = {"الفجر":"fajr","الضهر":"dhuhr","الظهر":"dhuhr","العصر":"asr","المغرب":"maghrib","العشا":"isha","العشاء":"isha"}, k = map[pm[1]];
    const at = et.today[k] > now ? et.today[k] : et.tomorrow[k];
    return `${PRAYER_AR[k]} ${dayKey(at) === dayKey(now) ? "النهاردة" : "بكرة"} الساعة ${fmtTime(at.toISOString())} في ${et.city}.`;
  }
  if (/^(مواعيد|مواقيت) (الصلاة|الصلاه)( النهاردة| النهارده| اليوم)?$/.test(t))
    return `مواقيت النهاردة في ${et.city}: ` + ["fajr","dhuhr","asr","maghrib","isha"].map(k => `${PRAYER_AR[k]} ${fmtTime(et.today[k].toISOString())}`).join("، ") + ".";
  // dates
  if (/^(النهاردة|النهارده|اليوم) (كام|ايه|إيه)( هجري)?$|^(التاريخ|تاريخ النهاردة|تاريخ النهارده)( هجري)?$/.test(t))
    return `النهاردة ${new Intl.DateTimeFormat("ar-EG", {weekday:"long", day:"numeric", month:"long", year:"numeric"}).format(now)}، يعني ${et.hijri}.`;
  // today's agenda
  if (/^(ايه|إيه) (اللي|الي) (عليا|عندي|ورايا) (النهاردة|النهارده|اليوم)$|^(جدولي|برنامجي) (النهاردة|النهارده)$/.test(t)){
    const items = todayList();
    if (!items.length) return "النهاردة مفيش حاجة متسجلة عليك. يوم فاضي.";
    return `النهاردة عندك ${items.length === 1 ? "حاجة واحدة" : items.length + " حاجات"}: ` + items.map(c => `${c.title} ${fmtTime(c.due)}`).join("، ") + ".";
  }
  const mem = localMemoryAnswer(t); if (mem) return mem;
  const sp = spendQuestion(t); if (sp) return sp;
  // working days in a month
  const wm = t.match(/^كام يوم شغل في (شهر )?(\S+)$/);
  if (wm){
    const k = wm[2].replace(/^ال/, ""), mi = AR_MONTHS[k];
    if (mi){
      const y = now.getMonth() + 1 > mi ? now.getFullYear() + 1 : now.getFullYear();
      const r = workdaysBetween(new Date(y, mi - 1, 1), new Date(y, mi, 0)), names = [...new Set(r.hols.map(x => x.name))];
      return `${k} ${y}: ${r.work} يوم شغل، و${r.off} يوم إجازة${names.length ? " (منهم " + names.join("، ") + ")" : ""}.`;
    }
  }
  return null;
}

/* ================= Nasem's learning: dictionary + knowledge memory, all on the phone ================= */
const KNOWLEDGE_DAYS = 30;
function knowledgeLookup(q){
  const now = Date.now(); let best = null;
  for (const k of S.knowledge || []){
    if (now - new Date(k.at).getTime() > KNOWLEDGE_DAYS * 864e5) continue;
    const sc = similarity(q, k.q);
    if (sc >= 0.8 && (!best || sc > best.sc)) best = {sc, ...k};
  }
  return best;
}
function knowledgeSave(q, guide){
  if (!q || !guide) return;
  S.knowledge = (S.knowledge || []).filter(k => similarity(q, k.q) < 0.8);
  S.knowledge.push({id:uid(), q, guide, at: nowISO()});
  if (S.knowledge.length > 80) S.knowledge = S.knowledge.slice(-80);
}

/* ================= backup restore, offline queue, update notice ================= */
function importData(){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".nasem,.json,application/json,application/octet-stream";
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    try{
      const text = await f.text(), B = BKA();
      if (B && B.isEnvelope(text)){ await restoreFromEnvelope(text, f.name); return; }
      const d = JSON.parse(text);
      if (!d || !Array.isArray(d.memories) || !Array.isArray(d.commitments)) throw new Error("not a Nasem backup");
      const n = d.memories.filter(m => m.active).length, c = d.commitments.length;
      if (!confirm(`النسخة دي فيها ${n} معلومة و${c} التزام${d.exported_at ? " (من " + fmtDay(d.exported_at) + ")" : ""}.\nهتحل مكان البيانات اللي على الجهاز ده. أكمّل؟`)) return;
      const keep = {consent: S.consent};
      delete d.exported_at; delete d.app;
      store.load(JSON.stringify({...d, ...keep}));
      S.lastBackup = nowISO();
      await store.save(); closeSheet(); render(); toast("اترجّعت بياناتك ✓");
    }catch(e){ console.warn(e); toast("الملف ده مش نسخة احتياطية من نسيم."); }
  };
  inp.click();
}
async function flushOutbox(){
  if (!S.outbox || !S.outbox.length || busy || !ready) return;
  const q = S.outbox.slice(); S.outbox = [];
  for (const item of q){
    S.messages = S.messages.filter(m => m.id !== item.id && m.queuedNote !== item.id);
    render(); await send(item.text, item.source || "text");
  }
}

/* ================= v4: repeating reminders, snooze, instant answers from memory ================= */
const REPEAT_AR = {daily:"كل يوم", weekdays:"أيام الشغل", weekly:"كل أسبوع", monthly:"كل شهر"};
function nextDue(iso, repeat){
  const d = new Date(iso);
  if (repeat === "daily") d.setDate(d.getDate() + 1);
  else if (repeat === "weekly") d.setDate(d.getDate() + 7);
  else if (repeat === "monthly"){ const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + 1); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); }
  else if (repeat === "weekdays"){ do { d.setDate(d.getDate() + 1); } while (isWeekend(d) || (typeof holidayOn === "function" && holidayOn(d))); }
  else return null;
  return d.toISOString();
}
/* Done with one occurrence -> the next one appears by itself (already approved: the user approved the series). */
function spawnNext(c){
  if (!c.repeat || !c.due) return null;
  let due = nextDue(c.due, c.repeat); const now = Date.now();
  while (due && new Date(due).getTime() <= now) due = nextDue(due, c.repeat);
  if (!due) return null;
  const n = {id:uid(), title:c.title, description:c.description, due, status:"pending", requires_approval:true, approved_at: nowISO(),
    is_proactive_generated:false, created_at: nowISO(), repeat:c.repeat, series: c.series || c.id};

/* A repeating reminder that passed long ago without "done" moves to its next time instead of piling up. */
function rollRepeats(){
  let changed = false; const limit = Date.now() - 12 * 3600e3;
  for (const c of S.commitments) if (c.repeat && c.status === "pending" && c.approved_at && c.due && new Date(c.due).getTime() < limit){
    let d = c.due; while (d && new Date(d).getTime() < Date.now()) d = nextDue(d, c.repeat);
    if (d){ c.due = d; c.missed = (c.missed || 0) + 1; changed = true; }
  }

}
function snooze(c, how){

  else { const o = new Date(c.due); d = new Date(); d.setDate(d.getDate() + 1); d.setHours(o.getHours() || 9, o.getMinutes(), 0, 0); }
  c.due = d.toISOString(); render(); store.save();
  if (typeof schedulePushSync === "function") schedulePushSync();

}
/* "رقم كريم كام؟" "عيد ميلاد سارة امتى؟" -> straight from memory: instant, offline, no AI request. Only when exactly one person matches. */
const MEM_ASK = [
  [/رقم|تليفون|تلفون|موبايل|نمر/, /phone|mobile|number|tel|رقم|موبايل|تليفون|نمر/, "رقم"],
  [/عيد ميلاد|ميلاد|اتولد/, /birth|ميلاد/, "عيد ميلاد"],
  [/عنوان|ساكن|ساكنة|بيته|بيتها/, /address|home|lives|عنوان|سكن|ساكن/, "عنوان"],
  [/ايميل|إيميل|الميل/, /email|mail|ايميل|إيميل/, "إيميل"],
  [/بيشتغل|بتشتغل|شغله|شغلها|وظيفة|وظيفت/, /job|work|employer|title|role|شغل|وظيف/, "شغل"],
];
function localMemoryAnswer(t){

  const ask = MEM_ASK.find(([q]) => q.test(t)); if (!ask) return null;
  const tw = new Set(wordsOf(t));
  const hits = S.memories.filter(m => m.active && m.entity !== "user" && (m.privacy !== "sensitive" || S.settings.sensitive)
    && ask[1].test(m.key) && wordsOf(m.entity).some(w => tw.has(w)));
  if (!hits.length || new Set(hits.map(m => m.entity)).size !== 1) return null;
  const m = hits.sort((a, b) => (b.last_confirmed_at || "").localeCompare(a.last_confirmed_at || ""))[0];
  return `${ask[2]} ${m.entity}: ${m.value}`;
}

/* ================= مصروف البيت: spending by voice, budget, and a price memory for Egyptian inflation ================= */
const SPEND_CATS = [
  ["أكل وبقالة", /عيش|خضار|خضرة|فاكه|لحم|فراخ|سمك|رز|أرز|سكر|زيت|بقال|سوبر|ماركت|جبن|لبن|بيض|طماطم|بطاطس|بصل|مكرون|شاي|بن |قهوة|أكل|اكل|غدا|عشا|فطار|فول|طعمية|عسل|تمر/],
  ["مواصلات", /مواصلات|أوبر|اوبر|تاكسي|بنزين|مترو|ميكروباص|توكتوك|توك توك|اتوبيس|أتوبيس|سولار|ركنة|جراج|كاريم/],
  ["فواتير وشحن", /كهربا|كهرباء|مية|مياه|غاز|نت|انترنت|إنترنت|فاتورة|كارت|رصيد|شحن|باقة|تليفون/],
  ["صحة", /دوا|دواء|صيدلي|دكتور|كشف|تحاليل|تحليل|أشعة|اشعة|علاج|نضارة/],
  ["تعليم", /دروس|درس|مدرسة|مدرسه|جامعة|كتب|كتاب|كورس|سنتر|ملازم/],
  ["بيت وتصليحات", /إيجار|ايجار|تصليح|سباك|كهربائي|نجار|منظفات|صيانة|بواب|زبالة/],
  ["خروج", /كافيه|مطعم|سينما|خروجة|فسحة|شيشة|حلويات|آيس كريم|ايس كريم/],
  ["لبس", /لبس|هدوم|جزمة|قميص|بنطلون|فستان|شنطة|عباية/],
  ["هدايا وواجبات", /هدية|نقطة|عيدية|واجب|عزا|فرح|صدقة|زكاة/],
];
const UNIT_RE = /(نص كيلو|ربع كيلو|كيلو جرام|كيلوجرام|كيلو|لتر|علبة|علب|كرتونة|كيس|حتة|حتت|زجاجة|ازازة|إزازة|طبق|رغيف|أرغفة)/;
const spendCat = item => (SPEND_CATS.find(([, re]) => re.test(item)) || ["تانية"])[0];
const itemKey = item => wordsOf(String(item).replace(UNIT_RE, " ")).filter(w => !/^\d+$/.test(w)).join(" ");
const fmtPct = n => new Intl.NumberFormat("ar-EG").format(Math.round(n)) + "٪";
const fmtQty = q => q === 0.5 ? "نص" : q === 0.25 ? "ربع" : new Intl.NumberFormat("ar-EG").format(q);
const monthKey = d => localISO(new Date(d)).slice(0, 7);

/* "صرفت 50 جنيه مواصلات" • "اشتريت 2 كيلو طماطم بـ 50" • "دفعت فاتورة الكهربا 430" -> {item, amount, qty, unit}. Unsure -> null (the AI handles it). */
function parseSpendLocal(t){
  let s2 = String(t).trim().replace(/[٠-٩]/g, c => "٠١٢٣٤٥٦٧٨٩".indexOf(c)).replace(/[,،٬]/g, "").replace(/[؟?!.]+$/, "");
  const m = s2.match(/^(?:أنا |انا )?(صرفت|دفعت|اشتريت|جبت)\s+(.+)$/); if (!m) return null;
  let rest = m[2];
  if (/سلف|جمعي/.test(rest)) return null;                         // loans and جمعيات have their own book
  const nums = [...rest.matchAll(/(\d+(?:\.\d+)?)\s*(ألف|الف|آلاف)?/g)].map(x => ({n: parseFloat(x[1]) * (x[2] ? 1000 : 1), i: x.index, len: x[0].length}));
  if (!nums.length || nums.length > 2) return null;
  let amt, qty = null;
  if (nums.length === 1) amt = nums[0];
  else {
    const byB = nums.find(x => /(بـ|ب|بحوالي|بسعر)\s*$/.test(rest.slice(0, x.i))) || nums.find(x => /^\s*(جنيه|ج\b|جم)/.test(rest.slice(x.i + x.len)));
    if (!byB) return null;
    amt = byB; qty = nums.find(x => x !== byB).n;
  }
  const unitM = rest.match(UNIT_RE);
  let unit = unitM ? unitM[1].replace(/كيلو جرام|كيلوجرام/, "كيلو") : null;
  if (unit === "نص كيلو"){ unit = "كيلو"; qty = (qty || 1) * 0.5; } else if (unit === "ربع كيلو"){ unit = "كيلو"; qty = (qty || 1) * 0.25; }
  else if (unit && qty == null) qty = 1;
  let item = (rest.slice(0, amt.i) + " " + rest.slice(amt.i + amt.len))
    .replace(/\d+(?:\.\d+)?/g, " ").replace(/جنيه|جنية|ج\b|جم\b/g, " ").replace(/(^|\s)(بـ|ب|بحوالي|بسعر|على|علي|في|عشان|حق|تمن|ثمن)(?=\s|$)/g, " ")
    .replace(/\s+/g, " ").trim();
  item = item.replace(/^(فاتورة|فاتوره)\s+/, "فاتورة ");
  if (!item || item.length > 60 || !amt.n) return null;
  return {item, amount: amt.n, qty: unit ? qty : null, unit};
}
function recordSpend(x){
  S.spend = S.spend || [];
  const at = nowISO(), key = itemKey(x.item), unitPrice = x.qty && x.unit ? x.amount / x.qty : null;
  const prev = unitPrice ? S.spend.slice().reverse().find(e => e.key === key && e.unit === x.unit && e.unitPrice && (Date.now() - new Date(e.at)) < 180 * 864e5) : null;
  const entry = {id: uid(), at, item: x.unit && key ? key : x.item, key, amount: x.amount, qty: x.qty, unit: x.unit, unitPrice, cat: spendCat(x.item)};
  S.spend.push(entry); if (S.spend.length > 3000) S.spend = S.spend.slice(-3000);
  let priceNote = null;
  if (prev){
    const ch = (unitPrice - prev.unitPrice) / prev.unitPrice;
    if (Math.abs(ch) >= 0.05) priceNote = `${key} ${ch > 0 ? "غليت" : "رخصت"} ${fmtPct(Math.abs(ch) * 100)} عن آخر مرة (${fmtMoney(prev.unitPrice)} ← ${fmtMoney(unitPrice)} لل${x.unit})`;
  }
  return {entry, priceNote};
}
function monthTotals(mk){
  const by = {}; let total = 0;

}
function budgetLine(total){

  return left >= 0 ? ` فاضل من ميزانية الشهر ${fmtMoney(left)} (${fmtPct(pct)} اتصرف).` : ` عدّيت ميزانية الشهر بـ ${fmtMoney(-left)}.`;
}
/* Called once per message; records and answers without any AI request. */
function localSpend(text){
  const x = parseSpendLocal(text); if (!x) return null;
  if (!S.settings.sensitive) return "عشان أسجل مصروفك، محتاج تسمح بحفظ المعلومات المالية: زرار الدرع ← الخصوصية. وبعدها قولها تاني.";
  const {entry, priceNote} = recordSpend(x);
  const t = monthTotals(monthKey(new Date())).total;
  const what = entry.qty ? `${fmtQty(entry.qty)} ${entry.unit} ${entry.item} بـ ${fmtMoney(entry.amount)}` : `${fmtMoney(entry.amount)} ${entry.item}`;
  const inCat = entry.cat === "تانية" || entry.cat.includes(entry.item) || entry.item.includes(entry.cat.split(" ")[0]) ? "" : ` في ${entry.cat}`;
  return `سجلت ${what}${inCat}.${priceNote ? " على فكرة، " + priceNote + "." : ""} صرفت الشهر ده ${fmtMoney(t)}.${budgetLine(t)}`;
}
/* "صرفت كام الشهر ده؟" "صرفت كام على الأكل؟" "مصروفي الشهر اللي فات" */
function spendQuestion(t){
  if (!/(صرفت|مصروف|مصاريف|المصروف)/.test(t) || !/(كام|ايه|إيه|قد ايه|قد إيه|الشهر|ملخص)/.test(t) || parseSpendLocal(t)) return null;
  if (!S.settings.sensitive) return "مصروف البيت محتاج تسمح بحفظ المعلومات المالية الأول: زرار الدرع ← الخصوصية.";

  const cat = SPEND_CATS.find(([c]) => t.includes(c.split(" ")[0])) || (/أكل|اكل|بقال/.test(t) ? SPEND_CATS[0] : null);

      const [H, M] = tm.split(":").map(Number), at = new Date(day); at.setHours(H, M, 0, 0);

  for (const c of S.commitments) if (c.status === "pending" && c.approved_at && c.due && new Date(c.due) > now && new Date(c.due) - now < 30 * 864e5)
    appts.push({client_id: "c" + c.id, title: c.title.slice(0, 120), at: c.due});
  return {doses: doses.slice(0, 200), appts: appts.slice(0, 100)};

/* ================= نبض السوق: official CBE rates, gold, your alerts, and what your project costs today ================= */
const FX_LIST = [["USD","الدولار"],["EUR","اليورو"],["SAR","الريال السعودي"],["AED","الدرهم الإماراتي"],["KWD","الدينار الكويتي"],["GBP","الإسترليني"]];
const FX_RE = {USD:/دولار|usd/i, EUR:/يورو|eur/i, SAR:/ريال|سعودي|sar/i, AED:/درهم|إماراتي|اماراتي|aed/i, KWD:/دينار|كويتي|kwd/i, GBP:/إسترليني|استرليني|gbp/i};

const MARKET_URL = {cbe:"https://api.frankfurter.dev/v2/providers/cbe/rates", gold:"https://xaus.com/api/v1/spot?unit=gram&currency=EGP"};

/* Accepts the shapes Frankfurter has used: rows [{base,quote,rate,date}] or {base,date,rates:{...}}. EGP per 1 unit of currency. */
function parseCbe(d){
  const rates = {}; let date = null;
  const put = (cur, egp) => { cur = String(cur || "").toUpperCase(); if (FX_RE[cur] && isFinite(egp) && egp > 1 && egp < 1000) rates[cur] = egp; };
  const rows = Array.isArray(d) ? d : Array.isArray(d && d.rates) ? d.rates : Array.isArray(d && d.data) ? d.data : null;
  if (rows) for (const r of rows){
    const b = String(r.base || "").toUpperCase(), q = String(r.quote || r.currency || r.symbol || "").toUpperCase(), v = +r.rate || +r.value;
    if (!v) continue; date = date || r.date || null;
    if (b === "EGP") put(q, 1 / v); else if (q === "EGP") put(b, v);
  } else if (d && d.rates && typeof d.rates === "object"){
    const b = String(d.base || "").toUpperCase(); date = d.date || null;
    for (const [k, v] of Object.entries(d.rates)){ if (b === "EGP") put(k, 1 / +v); else if (k.toUpperCase() === "EGP") put(b, +v); }
  }
  return rates.USD && rates.USD > 20 && rates.USD < 200 ? {rates, date} : null;
}
function parseGold(d, usd){
  let g24 = null;
  if (d && d.xau && /egp/i.test(d.xau.currency || "") && /gram/i.test(d.xau.unit || "")) g24 = +d.xau.price;
  else if (d && d.per_gram_usd && usd) g24 = +d.per_gram_usd * usd;
  return g24 && g24 > 500 && g24 < 100000 ? g24 : null;
}
function marketServer(){
  try{ const A = window.NASEM_APP; return (localStorage.getItem("nasem-server") || (A && A.gateway.get().url) || "").replace(/\/+$/, ""); }catch(e){ return ""; }
}
async function marketFetch(src){
  try{ const r = await fetch(MARKET_URL[src], {cache:"no-store"}); if (r.ok) return await r.json(); }catch(e){}
  const srv = marketServer(); if (!srv) throw new Error("no source");
  const r = await fetch(srv + "/v1/market/raw?src=" + src); if (!r.ok) throw new Error("relay " + r.status);
  return (await r.json()).data;
}
let marketBusy = null;
async function refreshMarket(force){
  if (S.market && !force && Date.now() - S.market.at < 30 * 60e3) return S.market;
  if (marketBusy) return marketBusy;
  marketBusy = (async () => {
    const [cbe, gold] = await Promise.allSettled([marketFetch("cbe"), marketFetch("gold")]);
    const fx = cbe.status === "fulfilled" ? parseCbe(cbe.value) : null;
    const usd = fx ? fx.rates.USD : (S.market && S.market.fx && S.market.fx.USD);
    const g24 = gold.status === "fulfilled" ? parseGold(gold.value, usd) : null;
    if (!fx && !g24) throw new Error("market sources unavailable");
    const old = S.market || {};
    S.market = {at: Date.now(), fx: fx ? fx.rates : old.fx || {}, fxDate: fx ? fx.date : old.fxDate, g24: g24 || old.g24 || null, fxAt: fx ? Date.now() : old.fxAt, goldAt: g24 ? Date.now() : old.goldAt};
    const dk = dayKey(new Date()); S.marketHist = S.marketHist || {};
    S.marketHist[dk] = {fx: S.market.fx, g24: S.market.g24};
    const keys = Object.keys(S.marketHist).sort(); while (keys.length > 40) delete S.marketHist[keys.shift()];
    checkMarketAlerts(); store.save();
    return S.market;
  })();
  try{ return await marketBusy; } finally { marketBusy = null; }
}
const goldK = (g24, k) => g24 * k / 24;
function marketValue(what){
  const m = S.market; if (!m) return null;
  if (what === "G21") return m.g24 ? goldK(m.g24, 21) : null;
  if (what === "G24") return m.g24; if (what === "G18") return m.g24 ? goldK(m.g24, 18) : null;
  return m.fx && m.fx[what] || null;
}
function marketYesterday(what){
  const dk = dayKey(new Date()), prev = Object.keys(S.marketHist || {}).sort().filter(k => k !== dk).pop(); if (!prev) return null;
  const h0 = S.marketHist[prev]; if (what.startsWith("G")) return h0.g24 ? goldK(h0.g24, +what.slice(1)) : null;
  return h0.fx && h0.fx[what] || null;
}
const WHAT_AR = what => what.startsWith("G") ? `عيار ${what.slice(1)}` : (FX_LIST.find(([c]) => c === what) || [, what])[1];
function trend(what){
  const now = marketValue(what), y = marketYesterday(what); if (!now || !y || Math.abs(now - y) / y < 0.0005) return "";
  return now > y ? ` ↑ ${fx2(now - y)}` : ` ↓ ${fx2(y - now)}`;
}
function isMarketText(t){ return /(سعر|بكام|كام|أسعار|اسعار|نبض السوق)/.test(t) && (Object.values(FX_RE).some(re => re.test(t)) || GOLD_RE.test(t) || /العملات|نبض السوق|أسعار النهاردة|اسعار النهارده/.test(t)) && !/(صرفت|اشتريت|دفعت|جبت)/.test(t); }
async function marketAnswer(t){
  let m; try{ m = await refreshMarket(false); }catch(e){ m = S.market; }
  if (!m) return "مش قادر أجيب الأسعار دلوقتي. اتأكد من النت وجرّب تاني.";
  const age = m.at && Date.now() - m.at > 2 * 3600e3 ? ` (آخر تحديث ${fmtDate(new Date(m.at).toISOString())})` : "";
  if (GOLD_RE.test(t)){
    if (!m.g24) return "سعر الدهب مش متاح دلوقتي.";
    return `الدهب النهاردة (تقديري من السعر العالمي): عيار 21 حوالي ${fx0(goldK(m.g24, 21))} جنيه للجرام${trend("G21")}، وعيار 24 ${fx0(m.g24)}، وعيار 18 ${fx0(goldK(m.g24, 18))}. المحلات بتزود المصنعية والهامش.${age}`;
  }
  const hit = FX_LIST.filter(([c]) => FX_RE[c].test(t) && m.fx[c]);
  if (hit.length) return hit.map(([c, n]) => `${n} في البنك المركزي ${fx2(m.fx[c])} جنيه${trend(c)}`).join("، ") + "." + age;
  return "نبض السوق: " + FX_LIST.filter(([c]) => m.fx[c]).slice(0, 3).map(([c, n]) => `${n} ${fx2(m.fx[c])}`).join("، ") + (m.g24 ? `، وعيار 21 حوالي ${fx0(goldK(m.g24, 21))}` : "") + "." + age;
}
/* "قولّي لما الدولار ينزل تحت 48" • "نبهني لو عيار 21 عدى 6000" */
function marketAlertLocal(raw){
  const t = String(raw).replace(/[٠-٩]/g, c => "٠١٢٣٤٥٦٧٨٩".indexOf(c)).replace(/[,،٬]/g, "");
  if (!/(قول|قوللي|قولي|قولّي|نبه|نبّه|بلغ|بلّغ|فكر|فكّر)/.test(t) || !/(لما|لو|اول ما|أول ما)/.test(t)) return null;
  let what = null;
  if (GOLD_RE.test(t)){ const k = (t.match(/عيار\s*(18|21|24)/) || [])[1] || "21"; what = "G" + k; }
  else { const c = Object.keys(FX_RE).find(k => FX_RE[k].test(t)); if (c) what = c; }
  if (!what) return null;
  const nums = (t.match(/\d+(?:\.\d+)?/g) || []).map(Number).filter(n => !(what.startsWith("G") && [18, 21, 24].includes(n)));
  if (nums.length !== 1) return null;
  const op = /(تحت|ينزل|نزل|يقل|قل|أقل|اقل|يوطى|يرخص)/.test(t) ? "below" : /(فوق|يعدي|عدى|يزيد|زاد|يطلع|طلع|أكتر|اكتر|يغلى)/.test(t) ? "above" : null;
  if (!op) return null;
  S.marketAlerts = (S.marketAlerts || []).filter(a => !(a.what === what && a.op === op));
  S.marketAlerts.push({id: uid(), what, op, value: nums[0], at: nowISO(), fired: null});
  store.save(); refreshMarket(false).catch(() => {});
  const now = marketValue(what);
  return `تمام. هبلغك لما ${WHAT_AR(what)} ${op === "below" ? "ينزل تحت" : "يعدّي"} ${fx2(nums[0])} جنيه${now ? ` (دلوقتي ${fx2(now)})` : ""}. بتأكد كل ما تفتح نسيم${marketServer() ? "" : ""}.`;
}
function checkMarketAlerts(){

    if (a.fired) continue; const v = marketValue(a.what); if (!v) continue;
    if ((a.op === "below" && v < a.value) || (a.op === "above" && v > a.value)){
      a.fired = nowISO(); a.firedValue = v;
      const msg = `${WHAT_AR(a.what)} ${a.op === "below" ? "نزل تحت" : "عدّى"} ${fx2(a.value)}: دلوقتي ${fx2(v)} جنيه.`;

    }
  }
}

function localGam(text){
  const x = parseGam(text); if (!x) return null;
  if (!S.settings.sensitive) return needMoneyConsent("دفتر الجمعيات");
  const askWhich = names => `عندك أكتر من جمعية: ${names.join("، ")}. قولي اسمها، مثلاً: "دفعت ${/^جمعي/.test(arNorm(names[0])) ? names[0] : "جمعية " + names[0]}".`;
  if (x.op === "mePaid"){
    const r = gamPick(x.s, g => g.role !== "organizer" || (g.people || []).some(p => p.isMe));
    if (r.none) return "مفيش جمعية مسجلة إنك مشترك فيها. قول مثلاً: \"دخلت جمعية 1000 في الشهر 10 أفراد وقبضي السابع من أكتوبر\".";
    if (r.ask) return askWhich(r.ask);
    const g = r.g, st = gamStatus(g);
    if (st.state === "notStarted") return `جمعية ${g.name} لسه ما بدأتش، أول قسط ${fmtMonthAr(gamMonthDate(g, 0))}.`;
    if (st.state === "done") return `جمعية ${g.name} خلصت خلاص.`;
    if (st.state === "unknown") return `محتاج أعرف جمعية ${g.name} بدأت إمتى. ظبطها من ذاكرتي ← الجمعيات.`;
    gamMark(g, st.i, gamMeKey(g));

    const total = gamMonthly(g) * st.N, turn = g.myTurn;
    const tail = turn ? (turn - 1 > st.i ? ` قبضك ${fmtMonthAr(gamMonthDate(g, turn - 1))} (${fmtMoney(total)}).` : turn - 1 === st.i ? ` والشهر ده دورك تقبض ${fmtMoney(total)} 🎉` : "") : "";
    return `سجلت إنك دفعت قسط ${g.name} لشهر ${fmtMonthAr(gamMonthDate(g, st.i))}. دفعت ${fmtN(k)} من ${fmtN(st.N)} أقساط.${tail}`;
  }

    if (hit.many) return `${x.name} موجود في أكتر من جمعية (${[...new Set(hit.many.map(h0 => h0.g.name))].join("، ")}). قولي اسم الجمعية.`;

    const paid = gamPaidRead(g, st.i), left = (g.people || []).filter(q => !paid[q.id]), rec = g.people[st.i];
    return `تمام، اتسجل قسط ${p.name} لشهر ${fmtMonthAr(gamMonthDate(g, st.i))}. ${left.length ? `فاضل ${fmtN(left.length)}: ${left.map(q => q.isMe ? "إنت" : q.name).join("، ")}.` : "كده الكل دفع ✓"} الشهر ده بيقبض ${rec.isMe ? "إنت" : rec.name} (${fmtMoney(gamMonthly(g) * st.N)}).`;
  }
  if (x.op === "unpaid"){
    const r = gamPick(x.s, g => g.role === "organizer");
    if (r.none) return "إنت مش منظّم أي جمعية عندي، فأنا متابع قسطك إنت بس. لو إنت اللي عامل الجمعية ضيفها من ذاكرتي ← الجمعيات.";
    if (r.ask) return askWhich(r.ask);
    const g = r.g, st = gamStatus(g); if (st.state !== "running") return `جمعية ${g.name} ${st.state === "done" ? "خلصت" : "لسه ما بدأتش"}.`;
    const paid = gamPaidRead(g, st.i), left = g.people.filter(q => !paid[q.id]);
    if (!left.length) return `كله دفع قسط ${g.name} الشهر ده ✓`;
    return {text: `لسه ما دفعوش قسط ${g.name} الشهر ده (${fmtN(left.length)} من ${fmtN(st.N)}): ${left.map(q => q.isMe ? "إنت" : q.name).join("، ")}.`, links: [{label: "ابعت تذكير للجروب (من غير أسامي)", url: waLink(null, gamReminderText(g))}]};
  }
  if (x.op === "myTurn" || x.op === "turn"){
    const r = gamPick(x.s, () => true);
    if (r.none) return "مفيش جمعيات مسجلة عندي.";
    if (r.ask) return askWhich(r.ask);
    const g = r.g, st = gamStatus(g);
    if (st.state === "unknown") return `محتاج أعرف جمعية ${g.name} بدأت إمتى.`;
    if (g.role === "organizer" && x.op === "turn"){
      if (st.state !== "running") return `جمعية ${g.name} ${st.state === "done" ? "خلصت" : `بتبدأ ${fmtMonthAr(gamMonthDate(g, 0))}، وأول واحد بيقبض ${g.people[0] ? g.people[0].name : "؟"}`}.`;
      const rec = g.people[st.i], nxt = g.people[st.i + 1];
      return {text: `الشهر ده الدور على ${rec.isMe ? "إنت" : rec.name} (${fmtMoney(gamMonthly(g) * st.N)}).${nxt ? ` الشهر الجاي: ${nxt.isMe ? "إنت" : nxt.name}.` : " وده آخر دور."}`, links: [{label: "ابعت الجدول واتساب", url: waLink(null, gamScheduleText(g))}]};
    }
    if (!g.myTurn) return `مش مسجل دورك في ${g.name}. قولي مثلاً: "دوري في جمعية ${g.name} السابع".`;
    const pd = gamMonthDate(g, g.myTurn - 1), left = g.myTurn - 1 - (st.i ?? 0);

function gamInsights(){

        action: ["دفعت ✓", () => { gamMark(g, st.i, me); render(); store.save(); toast("اتسجل."); }]});

    }

}

    const whenPart = (m = n.match(/(?:التسليم|تسليم|يسلم|هيسلم|يخلص|هيخلص|يخلصها|هيخلصها)\s*(.*)$/)) ? m[1] : "";

  if (trade && (m = n.match(/(?:عايز|عاوز|طالب|طلب|قالي|بيقول|بياخد|هياخد)\s+(?:.*?\s)?(\d{2,})/)) && n.indexOf(m[0]) > n.indexOf(nt[ti])){

    const what = (pi > 0 ? rest.slice(0, pi) : rest.slice(0, 4)).join(" ").replace(RX("\\s+(و|بس|وكان|كان)$"), "").trim();
    const price = pi >= 0 ? firstAmount(rest.slice(pi).join(" ")) : null;

/* ================= قفل نسيم: رقم سري + بصمة =================
   Honest scope: the data is already encrypted on the phone; the lock keeps people who pick up
   the phone out of the app. It is a gate in front of the app, not a second layer of encryption. */
const LOCK_KEY = "nasem-lock";
const lockCfg = () => { try{ return JSON.parse(localStorage.getItem(LOCK_KEY) || "null"); }catch(e){ return null; } };
const setLockCfg = c => { try{ c ? localStorage.setItem(LOCK_KEY, JSON.stringify(c)) : localStorage.removeItem(LOCK_KEY); }catch(e){} };
const b64 = u8 => btoa(String.fromCharCode(...new Uint8Array(u8)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function pinHash(pin, saltB64){
  const k = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveBits"]);
  return b64(await crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt: unb64(saltB64), iterations: 150000}, k, 256));
}
const PIN_RE = /^\d{4,6}$/;
let locked = false, hiddenAt = 0;
const LOCK_FAIL_KEY = "nasem-lock-fails";
const lockFails = () => { try{ return JSON.parse(localStorage.getItem(LOCK_FAIL_KEY) || '{"n":0,"until":0}'); }catch(e){ return {n: 0, until: 0}; } };
const setLockFails = v => { try{ localStorage.setItem(LOCK_FAIL_KEY, JSON.stringify(v)); }catch(e){} };
const bioAvailable = async () => { try{ return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }catch(e){ return false; } };
async function bioRegister(){
  const cred = await navigator.credentials.create({publicKey: {
    challenge: crypto.getRandomValues(new Uint8Array(32)), rp: {name: "نسيم"},
    user: {id: crypto.getRandomValues(new Uint8Array(16)), name: "nasem", displayName: "نسيم"},
    pubKeyCredParams: [{type: "public-key", alg: -7}, {type: "public-key", alg: -257}],
    authenticatorSelection: {authenticatorAttachment: "platform", userVerification: "required", residentKey: "discouraged"},
    timeout: 60000, attestation: "none"}});
  return b64(cred.rawId);
}
async function bioCheck(credB64){
  await navigator.credentials.get({publicKey: {challenge: crypto.getRandomValues(new Uint8Array(32)),
    allowCredentials: [{type: "public-key", id: unb64(credB64), transports: ["internal"]}], userVerification: "required", timeout: 60000}});
  return true;
}
function appShell(on){
  const app = document.querySelector(".app");

  else { app.setAttribute("inert", ""); app.style.visibility = "hidden"; }

}
function lockNow(){
  if (!lockCfg() || locked) return;
  locked = true; try{ if (window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  appShell(false); showLock();
}
function unlockApp(){
  locked = false; setLockFails({n: 0, until: 0});
  document.getElementById("lockView").hidden = true; appShell(true);
}
function showLock(){
  const c = lockCfg(), v = document.getElementById("lockView");
  const msg = h("div",{class: "lock-msg", role: "status", "aria-live": "polite"});
  const pin = h("input",{type: "password", inputmode: "numeric", autocomplete: "off", maxlength: "6", class: "lock-pin", "aria-label": "الرقم السري", placeholder: "••••"});
  const tryPin = async () => {
    const f = lockFails();
    if (Date.now() < f.until){ msg.textContent = `استنى ${Math.ceil((f.until - Date.now()) / 1000)} ثانية وجرّب تاني.`; return; }
    if (!PIN_RE.test(pin.value)){ msg.textContent = "الرقم من 4 لـ 6 أرقام."; return; }
    if (await pinHash(pin.value, c.salt) === c.hash){ unlockApp(); return; }
    const n = f.n + 1, wait = n >= 5 ? 30000 * Math.pow(2, Math.min(n - 5, 6)) : 0;
    setLockFails({n, until: Date.now() + wait}); pin.value = "";
    msg.textContent = wait ? `الرقم غلط ${n} مرات. استنى ${Math.round(wait / 1000)} ثانية.` : "الرقم غلط.";
  };
  pin.addEventListener("keydown", e => { if (e.key === "Enter") tryPin(); });
  pin.addEventListener("input", () => { if (pin.value.length === (c.len || 4)) tryPin(); });
  const bioBtn = c.cred ? h("button",{class: "btn ghost", onclick: async () => {
    try{ await bioCheck(c.cred); unlockApp(); }catch(e){ msg.textContent = "البصمة ما اشتغلتش. استخدم الرقم السري."; } }}, "☝️ افتح بالبصمة") : null;
  v.replaceChildren(h("div",{class: "lock-card"},
    h("div",{class: "lock-logo", "aria-hidden": "true"}, "🔒"),
    h("h2",{}, "نسيم مقفول"),
    h("p",{class: "att-note"}, c.cred ? "حط صباعك على الحساس، أو اكتب الرقم الاحتياطي." : "اكتب الرقم السري."),

  else setTimeout(() => pin.focus(), 50);
}

function searchAll(q){
  const n = arNorm(normNums(q)).toLowerCase().replace(/[؟?!.،,]/g, " ").trim(); if (n.length < 2) return [];
  const words = n.split(/\s+/).filter(w => w.length > 1).map(w => w.replace(/^ال(?=..)/, ""));
  if (!words.length) return [];
  const hit = t => { const x = arNorm(t).toLowerCase(); return words.every(w => x.includes(w)); };
  const out = [];
  for (const m of S.memories.filter(m => m.active)) if (hit(`${entityLabel(m.entity)} ${keyLabel(m.key)} ${m.value}`))
    out.push({g: "معلومات", t: m.value, sub: `${entityLabel(m.entity)} • ${keyLabel(m.key)}`, go: () => goTo("memory", "sec-mem")});
  for (const c of S.commitments) if (hit(`${c.title} ${c.description || ""}`))
    out.push({g: "التزامات", t: c.title, sub: c.status === "done" ? "خلص ✓" : c.due ? fmtDay(c.due) : "", go: () => goTo("tasks")});
  for (const d of S.documents || []) if (hit(`${d.title || ""} ${d.holder || ""} ${d.issuer || ""} ${d.notes || ""}`))
    out.push({g: "مستندات", t: d.title || d.type, sub: d.expiry ? "بينتهي " + fmtDay(d.expiry) : "", go: () => goTo("memory")});
  for (const c of S.crafts || []){
    const jobs = c.jobs.filter(j => hit(j.what));
    if (hit(`${c.name} ${c.trade}`) || jobs.length) out.push({g: "صنايعية", t: `${c.name} (${c.trade})`, sub: jobs[0] ? `${jobs[0].what}${jobs[0].price ? " بـ " + fmtMoney(jobs[0].price) : ""} • ${fmtShort(jobs[0].at)}` : stars(craftRating(c)),
      go: () => { craftOpen.add(c.id); goTo("memory", "sec-crafts"); }});
  }
  if (S.settings.sensitive){
    for (const a of S.accounts || []){ const notes = a.entries.filter(e => e.note && hit(e.note));
      if (hit(a.name) || notes.length) out.push({g: "حسابات", t: accLine(a), sub: notes[0] ? `${notes[0].note} • ${fmtShort(notes[0].at)}` : (a.kind === "customer" ? "زبون" : "مورد"),

    for (const g of S.ledger.gam3eyas || []) if (hit(g.name) || (g.people || []).some(p => hit(p.name)))
      out.push({g: "جمعيات", t: g.name, sub: `${fmtMoney(gamMonthly(g))} في الشهر`, go: () => { gamOpen.add(g.id); goTo("money", "sec-gam"); }});
    for (const b of balances()) if (hit(`${b.label || ""} ${b.person}`))
      out.push({g: "سلف", t: `${b.label || b.person}: ${b.net > 0 ? "ليك عنده" : "عليك له"} ${fmtMoney(Math.abs(b.net))}`, sub: "", go: () => goTo("money", "sec-loans")});
    const sp = {}; for (const e of S.spend || []) if (hit(e.item)){ const k = e.item; sp[k] = sp[k] || {n: 0, sum: 0, last: e}; sp[k].n++; sp[k].sum += e.amount; if (e.at > sp[k].last.at) sp[k].last = e; }
    for (const [k, v] of Object.entries(sp).sort((a, b) => b[1].sum - a[1].sum).slice(0, 6))
      out.push({g: "مصروف", t: `${k}: ${fmtN(v.n)} ${v.n === 1 ? "مرة" : "مرات"}، إجمالي ${fmtMoney(v.sum)}`, sub: `آخر مرة ${fmtMoney(v.last.amount)} • ${fmtShort(v.last.at)}`, go: () => goTo("money", "sec-spend")});
  }

  return out.slice(0, 60);
}

  const m = clean(text).replace(/[\u064B-\u0652\u0640]/g, "").match(RX("^(?:دور|ابحث|فتش|دورلي|دوري)\\s+(?:لي\\s+)?(?:على|عن|علي)\\s+(.+)$"));
  if (!m) return null;
  const q = m[1].trim(), r = searchAll(q).filter(x => x.g !== "المحادثة" && x.g !== "تقارير");
  if (!r.length) return null;                     // nothing of yours → smart research on the web
  const by = {}; for (const x of r) by[x.g] = (by[x.g] || 0) + 1;
  const top = r.slice(0, 4).map(x => `• ${x.t}`).join("\n");
  return {text: `لقيت ${fmtN(r.length)} عن "${q}" (${Object.entries(by).map(([g, n]) => `${g} ${fmtN(n)}`).join("، ")}):\n${top}`, links: [{label: "افتح كل النتايج", url: "#search:" + q}, {label: "🌐 دوّر على النت كمان", url: "#research:" + q}]};
}

/* ================= تقرير الشهر: صفحة واحدة لكل الفلوس، تتبعت أو تتطبع ================= */
function monthReport(d){
  const mk = monthKey(d), prev = monthKey(new Date(d.getFullYear(), d.getMonth() - 1, 1));
  const inM = iso => monthKey(iso) === mk, L = [], name = fmtMonthAr(d);
  L.push(`📄 تقرير ${name}`);
  const {total, by} = monthTotals(mk), pt = monthTotals(prev).total;
  L.push("", "💸 مصروف البيت");
  if (total){
    L.push(`• الإجمالي: ${fmtMoney(total)}${pt ? ` (${total >= pt ? "زيادة" : "أقل"} ${fmtPct(Math.abs(total - pt) / pt * 100)} عن الشهر اللي قبله)` : ""}`);
    const top = Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 4);
    for (const [c, v] of top) L.push(`• ${c}: ${fmtMoney(v)} (${fmtPct(v / total * 100)})`);
    const b = +S.settings.budget || 0; if (b) L.push(`• الميزانية ${fmtMoney(b)}: ${total > b ? `زاد ${fmtMoney(total - b)}` : `فاضل ${fmtMoney(b - total)}`}`);
  } else L.push("• مفيش مصروف متسجل.");
  const cust = (S.accounts || []).filter(a => a.kind === "customer"), sup = (S.accounts || []).filter(a => a.kind === "supplier");
  if (cust.length || sup.length){
    const sum = (as, type) => as.reduce((s, a) => s + a.entries.filter(e => e.type === type && inM(e.at)).reduce((x, e) => x + e.amount, 0), 0);
    L.push("", "📒 الحسابات");
    if (cust.length){
      const out = cust.reduce((s, a) => s + Math.max(0, accBalance(a)), 0);
      L.push(`• شكك جديد: ${fmtMoney(sum(cust, "charge"))} • اتحصّل: ${fmtMoney(sum(cust, "pay"))}`, `• ليك برة دلوقتي: ${fmtMoney(out)}`);
      const late = cust.filter(a => accBalance(a) > 0.5 && accOldest(a) && daysSince(accOldest(a)) >= 30).sort((a, b) => accBalance(b) - accBalance(a)).slice(0, 3);
      if (late.length) L.push(`• متأخر أكتر من شهر: ${late.map(a => `${a.name} ${fmtMoney(accBalance(a))}`).join("، ")}`);
    }
    if (sup.length) L.push(`• بضاعة من الموردين: ${fmtMoney(sum(sup, "charge"))} • دفعت لهم: ${fmtMoney(sum(sup, "pay"))} • عليك: ${fmtMoney(sup.reduce((s, a) => s + Math.max(0, accBalance(a)), 0))}`);
  }
  const gs = (S.ledger.gam3eyas || []).filter(g => g.start);
  if (gs.length){
    L.push("", "🤝 الجمعيات");
    for (const g of gs){
      const i = gamIdx(g, d), N = gamN(g); if (i == null || i < 0 || i >= N){ L.push(`• ${g.name}: ${i >= N ? "خلصت" : "لسه ما بدأتش"}`); continue; }
      const paid = gamPaidRead(g, i), me = gamMeKey(g);
      const bits = [`شهر ${fmtN(i + 1)} من ${fmtN(N)}`];
      if (me) bits.push(paid[me] ? "قسطك اتدفع ✓" : "قسطك لسه");
      if (g.role === "organizer") bits.push(`دفع ${fmtN((g.people || []).filter(p => paid[p.id]).length)} من ${fmtN(N)}`, `قبض: ${g.people[i].isMe ? "إنت" : g.people[i].name}`);
      else if (g.myTurn && g.myTurn - 1 === i) bits.push(`قبضت ${fmtMoney(gamMonthly(g) * N)} 🎉`);
      L.push(`• ${g.name}: ${bits.join("، ")}`);
    }
  }
  const lb = balances();
  if (lb.length){
    L.push("", "💵 السلف");
    for (const b of lb.slice(0, 5)) L.push(`• ${b.label || b.person}: ${b.net > 0 ? "ليك" : "عليك"} ${fmtMoney(Math.abs(b.net))}`);
  }
  const cj = (S.crafts || []).flatMap(c => c.jobs.filter(j => j.price && j.status !== "agreed" && inM(j.at)).map(j => ({c, j})));
  if (cj.length) { L.push("", "🔧 الصنايعية"); L.push(`• ${fmtN(cj.length)} ${cj.length === 1 ? "شغلانة" : "شغلانات"} بـ ${fmtMoney(cj.reduce((s, o) => s + o.j.price, 0))}: ${cj.slice(0, 3).map(o => `${o.j.what} (${o.c.name})`).join("، ")}`); }
  const hist = S.marketHist || {}, days = Object.keys(hist).filter(k => k.startsWith(mk)).sort();
  if (days.length >= 2){
    const a = hist[days[0]], z = hist[days[days.length - 1]], ch = (x, y) => `${fmtN(Math.round(x * 100) / 100)} ← ${fmtN(Math.round(y * 100) / 100)}`;
    const ln = [];
    if (a.fx && z.fx && a.fx.USD && z.fx.USD) ln.push(`• الدولار (البنك المركزي): ${ch(a.fx.USD, z.fx.USD)}`);
    if (a.g24 && z.g24) ln.push(`• جرام 21 (تقديري): ${ch(a.g24 * 0.875, z.g24 * 0.875)}`);
    if (ln.length) L.push("", "📈 السوق", ...ln);
  }
  L.push("", `— من نسيم، ${fmtDay(nowISO())}`);
  return L.join("\n");
}

const BKA = () => window.NASEM_APP && window.NASEM_APP.backup;

const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k, v) => { try{ v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(e){} };
let cloudMeta = null, cloudTimer = null, cloudBusy = false;
function passSheet({title, note, confirm: twice, okText}){
  return new Promise(resolve => {
    const p1 = h("input",{class: "voice-select", type: "password", autocomplete: twice ? "new-password" : "current-password", placeholder: "كلمة سر النسخة", dir: "auto"});

const NEW_PASS_NOTE = "كلمة السر دي بتقفل النسخة. نسيم ما بيبعتهاش لأي حد ولا بيحفظها على السيرفر، فلو نسيتها محدش يقدر يفتح النسخة، ولا حتى إحنا. اكتبها في مكان أمين.";
async function ensureBackupKey(){

  if (!pass) return false;

}
async function downloadEncrypted(){
  const B = BKA(); if (!B){ exportData(); return; }
  try{
    if (!(await ensureBackupKey())) return;
    const blob = await B.seal(snapshotState());
    const dl = await window.claude.use("downloads");
    await dl.save({filename: `nasem-backup-${localISO(new Date()).slice(0, 10)}.nasem`, data: blob});

  }catch(e){ console.warn(e); toast("ما قدرتش أعمل النسخة. جرّب تاني."); }

async function cloudBackupNow(force){
  const B = BKA(); if (!B || !S.settings.autoBackup || !B.available() || cloudBusy) return false;
  const last = +(lsGet("nasem-cloud-at") || 0);
  if (!force && Date.now() - last < 6 * 3600e3) return false;
  if (!(await B.hasKey())) return false;
  cloudBusy = true;
  try{
    const r = await B.upload(await B.seal(snapshotState()), deviceLabel());
    lsSet("nasem-cloud-at", String(Date.now())); cloudMeta = r; S.lastBackup = nowISO(); return true;
  }catch(e){ console.warn("cloud backup failed", e); return false; }
  finally{ cloudBusy = false; }
}

async function restoreFromEnvelope(text, where){

      const n = d.memories.filter(m => m.active).length, c = d.commitments.length, a = (d.accounts || []).length;
      if (!confirm(`النسخة دي${d.exported_at ? " من " + fmtDay(d.exported_at) : ""} فيها ${n} معلومة و${c} التزام${a ? ` و${a} حساب` : ""}.\nهتحل مكان البيانات اللي على الجهاز ده. أكمّل؟`)) return;
      delete d.exported_at; delete d.app;

function mergeSources(claimed, verified){
  if (!Array.isArray(verified)) return {list: [], searched: false};
  const out = [], vHosts = new Set();
  for (const v of verified){
    const host = REDIRECT_HOST.test(v.url) ? String(v.title || "").toLowerCase().replace(/^www\./, "") : hostOf(v.url);
    if (host) vHosts.add(host);
    out.push({url: v.url, host, title: v.title && !/^[\w.-]+\.\w+$/.test(v.title) ? v.title : "", date: v.age || null, cited: !!v.cited});
  }
  for (const c of claimed || []){
    const host = hostOf(c.url); if (!host || !vHosts.has(host)) continue;
    const same = out.find(o => o.host === host && (REDIRECT_HOST.test(o.url) || o.url === c.url));
    if (same){ if (!REDIRECT_HOST.test(c.url)) same.url = c.url; same.title = same.title || c.title || ""; same.date = same.date || c.date || null; }
    else out.push({url: c.url, host, title: c.title || "", date: c.date || null, cited: false});
  }
  const seen = new Set(), list = [];
  for (const o of out.sort((a, b) => b.cited - a.cited || OFFICIAL_HOST(b.host) - OFFICIAL_HOST(a.host))){
    const key = o.url; if (seen.has(key)) continue; seen.add(key); list.push({...o, official: OFFICIAL_HOST(o.host)});

function parseResearch(raw){

    rows: list(r.table.rows, 8, row => Array.isArray(row) ? row.slice(0, 5).map(x => str(String(x ?? ""), 120)) : null)} : null;

    confidence: ["high", "medium", "low"].includes(r.confidence) ? r.confidence : "medium",

  const kind = RESEARCH_KINDS.find(x => x.k === rec.kind) || RESEARCH_KINDS.at(-1), r = rec.report;
  const bits = [];
  if (r.as_of){ const d = daysSince(r.as_of + "T12:00:00"); bits.push(d > kind.fresh ? `⚠️ أحدث معلومة لقيتها من ${fmtN(d)} يوم، ممكن تكون اتغيرت` : `📅 أحدث معلومة: ${fmtDay(r.as_of)}`); }
  bits.push(`الثقة: ${{high: "عالية", medium: "متوسطة", low: "ضعيفة"}[r.confidence]}`);
  if (rec.searched) bits.push(`${fmtN(rec.sources.length)} ${rec.sources.length === 1 ? "مصدر" : "مصادر"}${rec.sources.some(s => s.official) ? " منهم رسمي" : ""}`);
  return bits.join(" • ");
}
function researchCard(m){
  const rec = (S.reports || []).find(r => r.id === m.research);
  if (!rec) return h("div",{class: "att-note"}, "التقرير ده اتمسح.");
  const r = rec.report, kind = RESEARCH_KINDS.find(x => x.k === rec.kind) || RESEARCH_KINDS.at(-1);
  const card = h("div",{class: "guide research"});
  card.append(h("div",{class: "rs-head"}, h("span",{class: "chip"}, kind.label), m.researchCached ? h("span",{class: "att-note"}, ` من تقرير ${ago(rec.at)} `) : null),
    h("h3",{}, r.title || rec.q), h("p",{class: "rs-bottom"}, r.bottom_line), h("div",{class: "att-note"}, freshLine(rec)));
  if (!rec.searched) card.append(h("div",{class: "att-note", style: "color:var(--danger)"}, "⚠️ المزود الحالي ما قدرش يدوّر على النت، فده من معلومات عامة ممكن تكون قديمة. ما تعتمدش عليه في أرقام أو مواعيد."));
  if (r.key_numbers.length) card.append(h("div",{class: "money-grid", style: "margin:8px 0"}, r.key_numbers.map(k => h("div",{class: "rs-num"}, h("div",{class: "sub"}, k.label), h("div",{class: "v"}, k.value), k.note ? h("div",{class: "sub"}, k.note) : null))));
  if (r.table) card.append(h("div",{class: "rs-table-wrap"}, h("table",{class: "rs-table"}, h("thead",{}, h("tr",{}, r.table.columns.map(c => h("th",{}, c)))), h("tbody",{}, r.table.rows.map(row => h("tr",{}, row.map(c => h("td",{}, c))))))));
  if (r.what_to_do.length) card.append(h("h4",{}, "تعمل إيه"), h("ol",{}, r.what_to_do.map(x => h("li",{}, x))));
  if (r.watch_out.length) card.append(h("h4",{}, "خلي بالك"), h("ul",{}, r.watch_out.map(x => h("li",{}, x))));
  if (r.sections.length || r.disagreements) card.append(h("details",{}, h("summary",{}, "التقرير كامل"),
    ...r.sections.map(s => h("div",{}, h("h4",{}, s.heading), h("ul",{}, s.points.map(p => h("li",{}, p))))),
    r.disagreements ? h("div",{}, h("h4",{}, "المصادر مختلفة في"), h("p",{}, r.disagreements)) : null));
  const mine = searchAll(rec.q).filter(x => x.g !== "المحادثة" && x.g !== "تقارير").slice(0, 3);
  if (mine.length) card.append(h("h4",{}, "من حاجاتك"), h("div",{class: "search-res", style: "max-height:none"}, mine.map(x => h("button",{class: "search-item", onclick: x.go}, h("div",{class: "v"}, x.t), x.sub ? h("div",{class: "sub"}, x.sub) : null))));
  if (rec.sources.length) card.append(h("h4",{}, "المصادر"), h("ul",{class: "rs-src"}, rec.sources.map(s => h("li",{},
    h("a",{href: s.url, target: "_blank", rel: "noopener noreferrer"}, s.title || s.host), " ",
    h("span",{class: "sub"}, [s.title ? s.host : null, s.date].filter(Boolean).join(" • ")), s.official ? h("span",{class: "chip done", style: "margin-inline-start:6px"}, "رسمي") : null))));
  else if (rec.searched) card.append(h("div",{class: "att-note"}, "ما لقيتش مصادر أقدر أوثّقها للسؤال ده، فاعتبر الكلام ده معلومة عامة."));
  if (r.follow_ups.length) card.append(h("div",{class: "chips", style: "margin-top:8px"}, r.follow_ups.map(f => h("button",{class: "chip", onclick: () => startResearch(f)}, "🔎 " + f))));
  card.append(h("div",{class: "row", style: "flex-wrap:wrap;margin-top:8px"},
    h("button",{class: "btn ghost", onclick: () => openUrl(waLink(null, reportText(rec)))}, "ابعته واتساب"),
    h("button",{class: "btn ghost", onclick: () => copyText(reportText(rec))}, "انسخ"),
    h("button",{class: "btn ghost", onclick: () => printReport(reportText(rec))}, "PDF"),
    h("button",{class: "btn ghost", onclick: () => refreshResearch(m.id)}, "🔄 حدّث")));
  return card;
}
function researchPending(m){
  if (m.researchState === "loading" && busy) return h("div",{class: "thinking-label"}, `بدوّر في ${(RESEARCH_KINDS.find(x => x.k === m.researchKind) || {}).label || "النت"} وبجهّز التقرير… ممكن ياخد دقيقة`);
  if (m.researchState === "failed" || m.researchState === "cancelled" || m.researchState === "loading")
    return h("div",{class: "chips"}, h("span",{class: "chip muted"}, m.researchState === "cancelled" ? "وقفت البحث" : (m.researchErr && m.researchErr !== "error" ? errText({}, m.researchErr) : "ما قدرتش أكمّل البحث"),
      h("button",{onclick: () => refreshResearch(m.id)}, "جرّب تاني")));
  return null;
}

function openSavedReport(id){
  const rec = (S.reports || []).find(r => r.id === id); if (!rec) return;
  const fake = {id: "saved", research: id, researchState: "ready", researchCached: true};
  sheet.replaceChildren(h("h2",{id: "sheetTitle"}, "📄 تقرير محفوظ"), researchCard(fake),
    h("div",{class: "row"}, h("button",{class: "btn ghost", onclick: () => { closeSheet(); startResearch(rec.q); }}, "🔄 ابحث تاني"),
      h("button",{class: "btn ghost", style: "color:var(--danger)", onclick: () => { S.reports = S.reports.filter(r => r.id !== id); store.save(); closeSheet(); toast("اتمسح."); }}, "امسح"),
      h("button",{class: "btn primary", onclick: closeSheet}, "تمام")));
  sheetBack.hidden = false;
}
function toast(t){ const el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2600); }
async function resetAll(){
  if (!confirm("هتتمسح كل الذكريات والالتزامات والموافقات. متأكد؟")) return;
  const consent = S.consent, settings = S.settings;
  if (window.NASEM_APP) await window.NASEM_APP.shredAll();   // new key: old encrypted data is gone for good
  S = {...blank(), consent, settings}; closeSheet(); render(); await store.save(); toast("اتمسح كل حاجة."); switchTab("chat");
}

/* ---------------- boot ---------------- */
if (lockCfg()) lockNow();      // locked before anything personal is drawn
render();
store.init().then(() => {
  ready = true; render(); scrollDown();
  handleShared();
  setTimeout(flushOutbox, 1500);
  activationOnBoot();
  setTimeout(() => familyRefresh(false), 3000);   // learn about family links early (sync + alerts)
  setTimeout(cloudBootCheck, 4000);
  // Ask the browser not to clear Nasem's data when the phone is low on space (Android Chrome grants this to installed apps).
  try{ if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p => p || navigator.storage.persist()).catch(() => {}); }catch(e){}
  if (!S.consent) openConsent(); else if (!S.profile.onboarded) openQuickSetup(); else input.focus({preventScroll:true});
});
</script>
