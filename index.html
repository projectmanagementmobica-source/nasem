}
function autosize(){ input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 120) + "px"; input.style.overflowY = input.scrollHeight > 120 ? "auto" : "hidden"; updateOrb(); }
input.addEventListener("input", autosize);
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); attachment ? runAttachment("ask", input.value) : send(input.value); } });

function startListening(){
  let finalText = "";
  gotSpeech = false;
  try{
    rec = new SR(); rec.lang = ttsPrefs.micLang || "ar-EG"; rec.interimResults = true; rec.maxAlternatives = 1; tryLocalSTT(rec);
  }catch(e){ blockMic(); return; }
  rec.onresult = ev => {
    gotSpeech = true;
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++){ const t = ev.results[i][0].transcript; if (ev.results[i].isFinal) finalText += t; else interim += t; }
    input.value = (finalText + interim).trim(); autosize();
  };
  rec.onerror = ev => {
    if (localSTTFailed(rec, ev)){ toast("التحويل على الموبايل مش متاح للغة دي، اضغط تاني."); return; }
    const kind = MIC_ERRORS[ev.error] || "retry";
    if (kind === "blocked") blockMic();
    else if (kind === "retry") toast("ما سمعتش حاجة. قرّب الموبايل واتكلم تاني.");
  };
  rec.onend = () => {
    listening = false; updateOrb();
    const t = input.value.trim();
    if (t && gotSpeech) send(t, "voice");
  };
  try{ rec.start(); listening = true; updateOrb(); }
  catch(e){ listening = false; blockMic(); }
}

orb.addEventListener("click", () => {
  const mode = orb.dataset.mode;
  if (mode === "stop"){ abortCtl && abortCtl.abort(); return; }
  unlockTTS();
  if (mode === "send"){ attachment ? runAttachment("ask", input.value) : send(input.value, "text"); return; }
  if (mode === "dictate"){ showDictationHint(true); input.focus(); return; }

});

/* voice out */
const ttsBtn = document.getElementById("ttsBtn");
let ttsOn = false;
try{ ttsOn = localStorage.getItem("nasem-demo-tts") === "1"; }catch(e){}
ttsBtn.setAttribute("aria-pressed", String(ttsOn));
const hasTTS = "speechSynthesis" in window;
if (!hasTTS) ttsBtn.hidden = true;
const ttsPrefs = (() => { try{ return {voice: localStorage.getItem("nasem-demo-voice") || "", voiceEn: localStorage.getItem("nasem-demo-voice-en") || "",
  rate: parseFloat(localStorage.getItem("nasem-demo-rate")) || 1, micLang: localStorage.getItem("nasem-demo-mic-lang") || "ar-EG"}; }catch(e){ return {voice:"", voiceEn:"", rate:1, micLang:"ar-EG"}; } })();
/* Reply language decides the voice: mostly Latin letters -> English voice, else Egyptian Arabic. */
function detectLang(t){
  const ar = (String(t).match(/[\u0600-\u06FF]/g) || []).length, en = (String(t).match(/[A-Za-z]/g) || []).length;
  return en > ar ? "en" : "ar";
}
function englishVoices(){ return hasTTS ? speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("en")) : []; }
function englishVoice(){
  const vs = englishVoices(); if (!vs.length) return null;
  const chosen = vs.find(v => v.voiceURI === ttsPrefs.voiceEn); if (chosen) return chosen;
  const score = v => (/en-us/i.test(v.lang) ? 4 : /en-gb/i.test(v.lang) ? 3 : 0) + (/natural|neural|enhanced|premium|google/i.test(v.name) ? 4 : 0);
  return [...vs].sort((a, b) => score(b) - score(a))[0];
}
function arabicVoices(){ return hasTTS ? speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("ar")) : []; }
/* Best available Arabic voice: the user's pick, else Egyptian, else the more natural-sounding engines. */
function arabicVoice(){
  const vs = arabicVoices(); if (!vs.length) return null;
  const chosen = vs.find(v => v.voiceURI === ttsPrefs.voice); if (chosen) return chosen;
  const score = v => (v.lang.toLowerCase() === "ar-eg" ? 8 : 0) + (/natural|neural|enhanced|premium|google/i.test(v.name) ? 4 : 0) + (v.localService ? 0 : 1);
  return [...vs].sort((a, b) => score(b) - score(a))[0];
}
if (hasTTS && "onvoiceschanged" in speechSynthesis) speechSynthesis.onvoiceschanged = () => {};
let ttsUnlocked = false;
function unlockTTS(){   // iOS only lets a page speak after a tap: prime the engine inside the tap.
  if (window.NASEM_APP && window.NASEM_APP.tts) window.NASEM_APP.tts.unlock();
  if (!hasTTS || ttsUnlocked) return;
  const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); ttsUnlocked = true;
}
function speakable(t){
  return String(t).replace(/https?:\/\/\S+/g, "").replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu, "")
    .replace(/[*_#`>|\[\]]/g, "").replace(/\s+/g, " ").trim();
}
function chunksOf(t){   // long utterances get cut off on some engines: speak sentence by sentence
  const parts = t.split(/(?<=[.!؟?،\n])\s+/), out = []; let cur = "";
  for (const p of parts){ if ((cur + " " + p).length > 180 && cur){ out.push(cur); cur = p; } else cur = cur ? cur + " " + p : p; }
  if (cur) out.push(cur); return out;
}
ttsBtn.addEventListener("click", () => {
  ttsOn = !ttsOn; ttsBtn.setAttribute("aria-pressed", String(ttsOn));
  try{ localStorage.setItem("nasem-demo-tts", ttsOn ? "1" : "0"); }catch(e){}
  if (!ttsOn){ if (hasTTS) speechSynthesis.cancel(); if (window.NASEM_APP && window.NASEM_APP.tts) window.NASEM_APP.tts.stop(); toast("الردود من غير صوت."); return; }
  // Speaking inside the tap unlocks audio on iOS; later replies can then play.
  toast(arabicVoice() ? "هقرأ الردود بصوت." : TTS_HELP.novoice);
  speak("تمام، هرد عليك بصوت.", true, true);   // speaks inside the tap (unlocks iOS) and reports if nothing plays
});
/* Voice health: "unknown" until the first real attempt, then "ok" or a reason. Many in-app browsers
   (notably the Claude app on Android) expose speechSynthesis but never actually speak. */
let ttsHealth = hasTTS ? "unknown" : "unsupported";
const TTS_HELP = {
  unsupported: "القراءة بصوت مش مدعومة هنا. افتح نفس اللينك من متصفح Chrome (أندرويد) أو Safari (آيفون).",
  silent: "الموبايل ما شغّلش الصوت. غالباً تطبيق Claude هنا مش بيدعم القراءة بصوت: افتح اللينك من Chrome أو Safari. ولو فتحته ولسه ساكت: تأكد إن صوت الوسائط مش مقفول.",
  novoice: "مفيش صوت عربي متسطب. من إعدادات الموبايل ← اللغة ← تحويل النص لكلام ← نزّل العربي.",
  error: "حصل خطأ في محرك الصوت على الموبايل. جرّب تاني، أو افتح اللينك من المتصفح.",
};
function speak(text, force = false, report = false){
  const cloud = window.NASEM_APP && window.NASEM_APP.tts && window.NASEM_APP.tts.enabled();
  if (!ttsOn && !force) return;
  const clean = speakable(text); if (!clean) return;
  const lang = detectLang(clean);
  if (cloud){
    if (hasTTS) speechSynthesis.cancel();
    cloudPending = true;
    window.NASEM_APP.tts.speak(clean, lang, ttsPrefs.rate).then(() => { ttsHealth = "ok"; }).finally(() => { cloudPending = false; }).catch(e => {
      console.warn("cloud voice failed, using the phone voice", e);
      if (report) toast(e && e.code === "bad_key" ? "مفتاح الصوت اترفض، هكمّل بصوت الموبايل." : "الصوت المصري مش متاح دلوقتي، هكمّل بصوت الموبايل.");
      speakDevice(clean, lang, report);
    });
    return;
  }
  speakDevice(clean, lang, report);
}
function speakDevice(clean, lang, report){
  if (!hasTTS){ if (report) toast(TTS_HELP.unsupported); return; }
  const pick = () => lang === "en" ? englishVoice() : arabicVoice();
  const v = pick();
  if (report && !v && !speechSynthesis.getVoices().length){
    // Voices can load late: retry once shortly, still inside the same user gesture's grace period.
    setTimeout(() => speakNow(clean, pick(), report, lang), 350); return;
  }
  speakNow(clean, v, report, lang);
}
function speakNow(clean, v, report, lang = "ar"){
  try{
    speechSynthesis.cancel();
    if (speechSynthesis.paused) speechSynthesis.resume();   // Chrome can get stuck paused
    let started = false;
    chunksOf(clean).forEach((c, i) => {
      const u = new SpeechSynthesisUtterance(c); u.lang = v ? v.lang : (lang === "en" ? "en-US" : "ar-EG"); if (v) u.voice = v; u.rate = ttsPrefs.rate;
      if (i === 0){
        u.onstart = () => { started = true; ttsHealth = "ok"; };
        u.onerror = ev => { if (ev.error === "interrupted" || ev.error === "canceled") return; ttsHealth = "error"; if (report) toast(TTS_HELP.error); };
      }
      speechSynthesis.speak(u);
    });
    if (report) setTimeout(() => {
      if (started || speechSynthesis.speaking || ttsHealth === "error") return;
      ttsHealth = arabicVoices().length || speechSynthesis.getVoices().length ? "silent" : "unsupported";
      toast(TTS_HELP[ttsHealth]);
    }, 2500);
  }catch(e){ ttsHealth = "error"; if (report) toast(TTS_HELP.error); }
}

/* ---------------- attachments: analyze, save, convert ----------------
   Files are read on the phone. Text (PDF/Word/Excel/CSV/TXT) is extracted here and MASKED like any
   message. Images (and scanned PDF pages rendered as images) go to Claude as-is: masking can't
   reach inside a picture, and the chat says so. */
const LIBS = {
  xlsx: "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js",
  pdf: "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js",
  pdfWorker: "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js",
  mammoth: "https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js",
  pptx: "https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js",
  docx: "https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js",
};
const libCache = {};
function loadLib(key){
  if (!libCache[key]) libCache[key] = new Promise((res, rej) => {
    const sc = document.createElement("script"); sc.src = LIBS[key];
    sc.onload = () => res(); sc.onerror = () => { delete libCache[key]; rej(Object.assign(new Error("lib"), {code:"lib_failed"})); };
    document.head.append(sc);
  });
  return libCache[key];
}
const MAX_DOC_CHARS = 30000;
let attachment = null;           // the file waiting in the tray
const attachById = new Map();    // message id -> attachment (session only, never saved)
let imageCaps;                   // undefined = not checked, null = images not available here

async function getImageCaps(){
  if (imageCaps !== undefined) return imageCaps;
  const sample = await getSample();
  const lim = sample ? await sample.limits().catch(() => null) : null;
  imageCaps = lim && lim.images ? lim.images : null;
  return imageCaps;
}
const attErr = msg => Object.assign(new Error(msg), {code:"attach", userMessage:msg});

async function pdfToAttachment(file, caps){
  await loadLib("pdf");
  const pdfjs = window.pdfjsLib; pdfjs.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker;
  const doc = await pdfjs.getDocument({data: await file.arrayBuffer()}).promise;
  const pages = Math.min(doc.numPages, 40); let text = "";
  for (let i = 1; i <= pages; i++){
    const page = await doc.getPage(i);
    const tc = await page.getTextContent();
    text += `\n--- صفحة ${i} ---\n` + tc.items.map(it => it.str + (it.hasEOL ? "\n" : " ")).join("");
  }
  const dense = text.replace(/\s|---|صفحة \d+/g, "").length / Math.max(1, pages);
  if (dense >= 40) return {kind:"doc", text, pages: doc.numPages};
  // Scanned PDF: render the first pages as images so Claude can read them.
  if (!caps) throw attErr("الـ PDF ده متصوّر (مش نص)، وقراية الصور مش متاحة هنا.");
  const n = Math.min(doc.numPages, caps.maxCount || 1, 4), images = [];
  for (let i = 1; i <= n; i++){
    const page = await doc.getPage(i), vp1 = page.getViewport({scale:1});
    const scale = Math.min(2, Math.sqrt(1.2e6 / (vp1.width * vp1.height)));
    const vp = page.getViewport({scale}), canvas = document.createElement("canvas");
    canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
    await page.render({canvasContext: canvas.getContext("2d"), viewport: vp}).promise;
    images.push(await new Promise(r => canvas.toBlob(r, "image/jpeg", 0.85)));
  }
  return {kind:"image", images, pages: doc.numPages, note: doc.numPages > n ? `اتقري أول ${n} صفحات بس` : null};
}

async function readAttachment(file){
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  const caps = await getImageCaps();
  let out;
  if (file.type.startsWith("image/")){
    if (!caps) throw attErr("قراية الصور مش متاحة في العرض ده. جرّب PDF أو Word أو Excel.");
    if (caps.mediaTypes && !caps.mediaTypes.includes(file.type)) throw attErr("نوع الصورة ده مش مدعوم. استخدم JPG أو PNG.");
    if (caps.maxInputBytes && file.size > caps.maxInputBytes) throw attErr("الصورة كبيرة أوي.");
    out = {kind:"image", images:[file]};
  } else if (ext === "pdf"){
    out = await pdfToAttachment(file, caps);
  } else if (["xlsx", "xls", "csv"].includes(ext)){
    await loadLib("xlsx");
    const wb = window.XLSX.read(await file.arrayBuffer(), {type:"array"});
    const text = wb.SheetNames.map(n => `--- شيت: ${n} ---\n` + window.XLSX.utils.sheet_to_csv(wb.Sheets[n])).join("\n");
    out = {kind:"doc", text, sheets: wb.SheetNames.length};
  } else if (ext === "docx"){
    await loadLib("mammoth");
    const r = await window.mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()});
    out = {kind:"doc", text: r.value};
  } else if (file.type.startsWith("audio/") || ["opus","ogg","m4a","mp3","wav","aac"].includes(ext)){
    const can = window.NASEM_APP && window.NASEM_APP.canAudio && window.NASEM_APP.canAudio();
    if (!can) throw attErr(window.NASEM_APP
      ? "تفريغ الفويس محتاج مفتاح Gemini (الإعدادات ← مصدر الذكاء ← مفاتيحي). لحد ما تضيفه: انسخ نص الرسالة والصقه هنا."
      : "تفريغ الفويس متاح في تطبيق نسيم. هنا: انسخ نص الرسالة والصقه في الشات.");
    if (file.size > 15e6) throw attErr("الفويس كبير أوي (أكتر من 15 ميجا).");
    out = {kind:"audio", audio:file, mime: file.type || ({opus:"audio/ogg", ogg:"audio/ogg", m4a:"audio/mp4", mp3:"audio/mpeg", aac:"audio/aac"}[ext] || "audio/wav")};
  } else if (["txt", "md", "json"].includes(ext)){
    out = {kind:"doc", text: await file.text()};
  } else {
    throw attErr("النوع ده مش مدعوم لسه. الأنواع المدعومة: صور، PDF، Word، Excel، CSV، TXT.");
  }
  if (out.kind === "doc"){
    out.text = (out.text || "").trim();
    if (!out.text) throw attErr("ما لقيتش نص في الملف ده.");
    if (out.text.length > MAX_DOC_CHARS){ out.text = out.text.slice(0, MAX_DOC_CHARS); out.note = "الملف طويل، اتقري أوله بس"; }
  }
  return {...out, name: file.name};
}

function attachmentBlock(a){

function buildDocPrompt(action, a, question){
  if (action === "rx") return `Read this medical prescription (often handwritten by an Egyptian doctor). ${DOC_RULES}
SAFETY: copy each drug name EXACTLY as written. If you are not sure of a name, strength or dose, set legibility "unsure". Never invent, guess or "correct" a drug, and never add drugs that are not written.
If the prescription doesn't give times, suggest them from times_per_day (1 -> 09:00; 2 -> 09:00, 21:00; 3 -> 08:00, 14:00, 20:00; 4 -> 08:00, 12:00, 16:00, 20:00).
Reply with ONLY one JSON object:
{"doctor":"... or null","date":"YYYY-MM-DD or null","meds":[{"name":"as written","strength":"e.g. 500mg or null","dose":"e.g. قرص / معلقة or null","times_per_day":number or null,"times":["HH:MM"],"duration_days":number or null,"instructions":"e.g. بعد الأكل or null","legibility":"clear|unsure"}],"warnings":["anything unclear"]}${attachmentBlock(a)}`;
  if (action === "vault") return `Extract the key facts of this official document or card so the user can track its renewal. ${DOC_RULES}
PRIVACY: never copy a full ID, passport, license, card or account number. Give ONLY its last 4 digits in number_last4.
Reply with ONLY one JSON object:
{"doc_type":"passport|national_id|driving_license|car_license|insurance|contract|subscription|warranty|other","title":"short Arabic title, e.g. رخصة القيادة","holder_name":"... or null","issuer":"... or null","issue_date":"YYYY-MM-DD or null","expiry_date":"YYYY-MM-DD or null","number_last4":"last 4 digits or null","notes":"renewal-relevant notes or null"}${attachmentBlock(a)}`;
  if (action === "scam") return `Assess whether this message, offer or request is a scam. Context: Egypt. Common patterns: fake prizes, requests for OTP or verification codes, fake bank / InstaPay / e-wallet messages, fake delivery or customs fees, jobs that need a deposit, someone impersonating a relative in trouble, urgent pressure, links to unofficial sites. ${DOC_RULES}
Never say it is guaranteed safe. Always remind: never share OTP, PIN or card details, and verify through the official number printed on the card or the official app.
Reply with ONLY one JSON object:
{"verdict":"likely_scam|suspicious|looks_ok|cannot_tell","headline":"one short sentence in the user's dialect","reasons":["up to 5 concrete signs found in THIS message"],"do":["up to 4 steps"],"dont":["up to 3"]}${attachmentBlock(a)}`;
  if (action === "voice") return `The attachment is a voice note someone sent the user. Transcribe it faithfully in the spoken dialect, then summarize it for the user. ${DOC_RULES}
current_datetime: ${localISO(new Date())}
Reply with ONLY one JSON object:
{"title":"short title","summary":"2-4 sentences","speaker":"who is talking if clear, else null","asks":["what the speaker wants from the user, up to 5"],"dates":[{"what":"...","when":"..."}],"amounts":[{"what":"...","amount":"..."}],"transcript":"full transcript","warnings":["unclear parts"]}${attachmentBlock(a)}`;
  const today = localISO(new Date());
  const ask = question && question.trim() ? question.trim() : (action === "summary" ? "لخّص الملف ده وحلله: إيه أهم حاجة فيه، وإيه اللي محتاج مني أعمله؟" : "");
  if (action === "excel") return `Convert the tables/lists in the attached file into a clean spreadsheet. ${DOC_RULES}
Keep every row faithfully; use numbers as numbers (no currency symbols inside numeric cells; put the unit in the column name). Max 400 rows per sheet.
Reply with ONLY one JSON object:
{"file_name":"short name without extension","sheets":[{"name":"max 31 chars","columns":["..."],"rows":[["cell","..."]]}],"notes":"what could not be read, or null"}
${question ? "User note: " + esc(question, "attachment") : ""}${attachmentBlock(a)}`;
  if (action === "text") return `Transcribe the attached file into clean plain text, faithfully, keeping its order and line breaks (fix obvious OCR noise only). ${DOC_RULES}
Reply with ONLY one JSON object: {"title":"short title","text":"the full text","notes":"what could not be read, or null"}${attachmentBlock(a)}`;
  return `You are NASEM (نسيم) helping the user with a file they attached. ${DOC_RULES}${docStyle()}
current_datetime: ${today}
User request: ${esc(ask, "attachment")}
Reply with ONLY one JSON object:
{"title":"short title of the file","answer":"direct answer to the request, 2-6 sentences","key_points":["up to 6"],"dates":[{"what":"...","when":"date/time as written or ISO"}],"amounts":[{"what":"...","amount":"..."}],"warnings":["unclear or unreadable parts, suspicious items"]}${attachmentBlock(a)}`;
}

function parseDoc(action, raw){
  const str = (v, max = 4000) => typeof v === "string" && v.trim() ? v.trim().slice(0, max) : null;
  if (!raw || typeof raw !== "object") throw outputError("not an object");
  const listOf = (v, n, f) => Array.isArray(v) ? v.map(f).filter(Boolean).slice(0, n) : [];
  const isoDay = v => typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v) && !isNaN(new Date(v)) ? v : null;
  if (action === "rx"){
    const meds = listOf(raw.meds, 12, x => {
      if (!x || !str(x.name, 120)) return null;
      const times = (Array.isArray(x.times) ? x.times : []).map(t => String(t).trim()).filter(t => /^\d{1,2}:\d{2}$/.test(t)).slice(0, 6);
      const DEFAULT_TIMES = {1:["09:00"], 2:["09:00","21:00"], 3:["08:00","14:00","20:00"], 4:["08:00","12:00","16:00","20:00"]};
      const fallback = DEFAULT_TIMES[Math.min(4, Math.max(1, parseInt(x.times_per_day, 10) || 1))];
      return {name: str(x.name, 120), strength: str(x.strength, 60), dose: str(x.dose, 60), times: times.length ? times : fallback,
        days: Math.min(365, Math.max(0, parseInt(x.duration_days, 10) || 0)) || null, instructions: str(x.instructions, 120), unsure: x.legibility !== "clear"};
    });
    if (!meds.length) throw outputError("no medicines found");
    return {type:"rx", doctor: str(raw.doctor, 80), date: isoDay(raw.date), meds, warnings: listOf(raw.warnings, 4, x => str(x, 200)), activated:false};
  }
  if (action === "vault"){
    const title = str(raw.title, 80); if (!title) throw outputError("no document title");
    const digits = String(raw.number_last4 || "").replace(/\D/g, "");
    return {type:"vault", doc_type: str(raw.doc_type, 30) || "other", title, holder: str(raw.holder_name, 120), issuer: str(raw.issuer, 120),
      issue: isoDay(raw.issue_date), expiry: isoDay(raw.expiry_date), last4: digits ? digits.slice(-4) : null, notes: str(raw.notes, 300)};
  }
  if (action === "scam"){
    const verdict = ["likely_scam","suspicious","looks_ok","cannot_tell"].includes(raw.verdict) ? raw.verdict : "cannot_tell";
    return {type:"scam", verdict, headline: str(raw.headline, 200) || "", reasons: listOf(raw.reasons, 5, x => str(x, 200)),
      do: listOf(raw.do, 4, x => str(x, 200)), dont: listOf(raw.dont, 3, x => str(x, 200))};
  }
  if (action === "voice"){
    const summary = str(raw.summary, 1500); if (!summary) throw outputError("empty summary");
    return {type:"analysis", voice:true, title: str(raw.title, 120) || "فويس", answer: summary, speaker: str(raw.speaker, 80),
      asks: listOf(raw.asks, 5, x => str(x, 200)), key_points: [],
      dates: listOf(raw.dates, 10, x => x && str(x.what, 200) ? {what: str(x.what, 200), when: str(x.when, 80) || ""} : null),
      amounts: listOf(raw.amounts, 10, x => x && str(x.what, 200) ? {what: str(x.what, 200), amount: str(x.amount, 80) || ""} : null),
      warnings: listOf(raw.warnings, 4, x => str(x, 300)), transcript: str(raw.transcript, 20000)};
  }
  if (action === "excel"){
    const sheets = (Array.isArray(raw.sheets) ? raw.sheets : []).map(sh => ({
      name: (str(sh && sh.name, 31) || "Sheet").replace(/[\\/?*[\]:]/g, " "),
      columns: Array.isArray(sh && sh.columns) ? sh.columns.map(c => String(c ?? "")) : [],
      rows: (Array.isArray(sh && sh.rows) ? sh.rows : []).filter(Array.isArray).slice(0, 400)
        .map(r => r.map(c => (typeof c === "number" || typeof c === "string") ? c : (c == null ? "" : String(c)))),
    })).filter(sh => sh.columns.length || sh.rows.length);
    if (!sheets.length) throw outputError("no tables found");
    return {type:"excel", fileName: (str(raw.file_name, 60) || "nasem-table").replace(/[\\/:*?"<>|]/g, " "), sheets, notes: str(raw.notes, 400)};
  }
  if (action === "text"){
    const text = str(raw.text, 60000); if (!text) throw outputError("empty text");
    return {type:"text", title: str(raw.title, 120) || "النص", text, notes: str(raw.notes, 400)};
  }
  const answer = str(raw.answer, 2000); if (!answer) throw outputError("empty answer");
  const list = (v, n, f) => Array.isArray(v) ? v.map(f).filter(Boolean).slice(0, n) : [];
  return {type:"analysis", title: str(raw.title, 120) || "الملف", answer,
    key_points: list(raw.key_points, 6, x => str(x, 300)),
    dates: list(raw.dates, 10, x => x && str(x.what, 200) ? {what: str(x.what, 200), when: str(x.when, 80) || ""} : null),
    amounts: list(raw.amounts, 10, x => x && str(x.what, 200) ? {what: str(x.what, 200), amount: str(x.amount, 80) || ""} : null),
    warnings: list(raw.warnings, 4, x => str(x, 300))};
}

async function runAttachment(action, question){
  if (busy || !ready || !attachment || attachment.loading) return;
  if (!S.consent){ openConsent(); return; }
  if (action === "rx" && !S.settings.sensitive){ toast("الروشتة بيانات صحية: اسمح بحفظ المعلومات الصحية والمالية الأول."); openSettings(); return; }
  const a = attachment; attachment = null; renderTray();
  const label = question && question.trim() ? question.trim() : (ATT_ACTIONS.find(x => x[0] === action) || [,"حلّل الملف"])[1];
  input.value = ""; autosize();
  const userMsg = {id:uid(), role:"user", text: label, at: nowISO(), source:"text", attachment:{name: a.name, kind: a.kind}};
  S.messages.push(userMsg); attachById.set(userMsg.id, a); noteMessage(label, "text");
  busy = true; switchTab("chat"); render(); scrollDown();
  await processAttachment(action, a, question, userMsg.id);
}

async function processAttachment(action, a, question, userMsgId){
  const vault = makeVault();
  const images = a.kind === "image" ? a.images : undefined;
  const privacy = {hidden: 0, sent: "", image: a.kind === "image"};
  let agent;
  try{
    if (action === "save"){
      const ctx = buildContext();
      const text = (question && question.trim() ? question.trim() : "طلّع من المرفق ده أي مواعيد أو التزامات أو معلومات تهمني واقترح حفظها.") + attachmentBlock(a);
      const parsed = await extract(text, ctx, vault, images);
      const result = persist(parsed, "text", uid());
      agent = {id:uid(), role:"agent", text: parsed.reply, at: nowISO(), result};
    } else {
      const sample = await getSample();
      if (!sample){ const e = new Error("no sample"); e.code = "sampling_unavailable"; throw e; }
      abortCtl = new AbortController();
      const opts = {modelTier:"default", cache:false, signal: abortCtl.signal, images: images && images.length ? images : undefined};
      if (a.kind === "audio") opts.audio = a.audio;
      const raw = vault.unmask(await sample.json(vault.mask(buildDocPrompt(action, a, question)) + TOKEN_NOTE, opts));
      const doc = parseDoc(action, raw);
      let intro = {excel:"جهزتلك الجدول. راجعه ونزّله Excel.", text:"ده النص اللي في الملف.", analysis:"", scam: doc.headline,
        rx:"قريت الروشتة. راجع الأسماء والجرعات مع الصيدلي قبل ما نفعّل جدول الدوا."}[doc.type], result;
      if (doc.type === "vault"){ const saved = saveDocument(doc, a.name); intro = saved.text; result = saved.result; }
      agent = {id:uid(), role:"agent", text: intro || doc.answer, at: nowISO(), doc, sourceMsg: userMsgId, result};
      if (doc.type === "analysis") agent.doc.answerShown = true;
    }
    privacy.audio = a.kind === "audio";
    statBump("files"); statBump("hidden", vault.size); if (a.kind !== "doc") statBump("rawMedia");
    privacy.hidden = vault.size; privacy.sent = a.kind === "doc" ? vault.mask(a.text).slice(0, 600) + (a.text.length > 600 ? "…" : "") : "(صورة)";
    agent.privacy = privacy;
  }catch(e){
    const code = (e && e.code) || "llm_unavailable";
    if (code !== "cancelled") console.warn(e);
    const msg = code === "images_unavailable" ? "قراية الصور مش متاحة هنا." : code === "image_rejected" ? "الصورة دي ما اتقبلتش (نوع أو حجم غير مدعوم)." : code === "llm_output_invalid" ? "ما قدرتش أطلّع حاجة مفيدة من الملف ده. جرّب صورة أوضح أو ملف تاني." : (FALLBACK[code] || FALLBACK.llm_unavailable);
    agent = {id:uid(), role:"agent", text: msg, at: nowISO(), error: code};
  }
  if (!agent.error && window.NASEM_APP) agent.provider = window.NASEM_APP.state.lastProvider;
  S.messages.push(agent);
  busy = false; abortCtl = null; render(); scrollDown(); store.save();
  if (["no_key","bad_key","login_required"].includes(agent.error)) openSettings();
  if (!agent.error) speak(agent.text);
}

async function saveXlsx(doc){
  try{
    await loadLib("xlsx");
    const X = window.XLSX, wb = X.utils.book_new();
    for (const sh of doc.sheets){
      const ws = X.utils.aoa_to_sheet([sh.columns, ...sh.rows]);
      ws["!cols"] = sh.columns.map((c, i) => ({wch: Math.min(40, Math.max(10, String(c).length + 2, ...sh.rows.slice(0, 50).map(r => String(r[i] ?? "").length + 2)))}));
      X.utils.book_append_sheet(wb, ws, sh.name);
    }
    wb.Workbook = {Views: [{RTL: true}]};
    const bytes = X.write(wb, {type:"array", bookType:"xlsx"});
    await downloadFile(`${doc.fileName}.xlsx`, new Uint8Array(bytes));
  }catch(e){ console.warn(e); toast("ما قدرتش أعمل ملف Excel هنا."); }
}
async function downloadFile(filename, data){
  const dl = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null;
  if (!dl){ toast("التنزيل مش متاح في العرض ده."); return; }
  try{ await dl.save({filename, data}); }
  catch(e){ if (e && e.code !== "declined") toast("التنزيل ما تمش."); }
}

function docCard(m){
  const d = m.doc, card = h("div",{class:"guide"});
  const src = attachById.get(m.sourceMsg);
  if (d.type === "vault"){
    const rows = [["النوع", d.title], ["باسم", d.holder], ["الجهة", d.issuer], ["تاريخ الإصدار", d.issue ? fmtDay(d.issue) : null],
      ["تاريخ الانتهاء", d.expiry ? fmtDay(d.expiry) : null], ["آخر 4 أرقام", d.last4]].filter(r => r[1]);
    card.append(h("h3",{}, d.title), h("div",{class:"pick"}, rows.flatMap(([k, v]) => [h("b",{}, k), h("span",{}, v)])));
    if (d.notes) card.append(h("div",{class:"sub"}, d.notes));
    card.append(h("div",{class:"att-note"}, "ما بحفظش رقم المستند كامل ولا الصورة، بحفظ البيانات دي بس."),
      h("div",{class:"row"}, h("button",{class:"btn ghost", onclick:() => send(`أجدد ${d.title} إزاي وإيه الورق المطلوب؟`)}, "دليل التجديد")));
    return card;
  }
  if (d.type === "rx") return rxCard(m);
  if (d.type === "scam"){
    const V = {likely_scam:["bad","غالباً نصب"], suspicious:["warnv","مشبوه"], looks_ok:["okv","شكله سليم، بس خد بالك"], cannot_tell:["muted","مش قادر أحكم"]}[d.verdict];
    card.append(h("div",{class:"verdict " + V[0]}, V[1]), d.headline ? h("div",{class:"bottom"}, d.headline) : null);
    if (d.reasons.length) card.append(h("div",{}, h("h4",{}, "العلامات"), h("ul",{}, d.reasons.map(t => h("li",{}, t)))));
    if (d.do.length) card.append(h("div",{}, h("h4",{}, "اعمل كده"), h("ul",{}, d.do.map(t => h("li",{}, t)))));
    if (d.dont.length) card.append(h("div",{}, h("h4",{}, "ما تعملش"), h("ul",{}, d.dont.map(t => h("li",{}, t)))));
    card.append(h("div",{class:"att-note"}, "ده تقدير مش ضمان. أي شك: كلّم البنك أو الجهة على رقمها الرسمي، وعمرك ما تدّي كود التحقق لحد."));
    return card;
  }
  if (d.type === "analysis"){
    card.append(h("h3",{}, d.title), d.speaker ? h("div",{class:"sub"}, "من: " + d.speaker) : null);
    if (d.asks && d.asks.length) card.append(h("div",{}, h("h4",{}, "المطلوب منك"), h("ul",{}, d.asks.map(t => h("li",{}, t)))));
    if (d.key_points.length) card.append(h("div",{}, h("h4",{}, "أهم النقاط"), h("ul",{}, d.key_points.map(t => h("li",{}, t)))));
    if (d.dates.length) card.append(h("div",{}, h("h4",{}, "مواعيد"), h("ul",{}, d.dates.map(x => h("li",{}, x.what, x.when ? h("span",{style:"color:var(--muted)"}, "، " + x.when) : null)))));
    if (d.amounts.length) card.append(h("div",{}, h("h4",{}, "مبالغ"), h("ul",{}, d.amounts.map(x => h("li",{}, x.what, x.amount ? h("span",{style:"color:var(--muted)"}, "، " + x.amount) : null)))));
    if (d.warnings.length) card.append(h("div",{class:"warn"}, "خلي بالك: " + d.warnings.join(" • ")));
    const acts = [];
    if (d.transcript) card.append(h("details",{class:"transcript"}, h("summary",{}, "النص كامل"), h("div",{class:"doc-text"}, d.transcript)));
    if (src && (d.dates.length || d.amounts.length || (d.asks && d.asks.length))) acts.push(h("button",{class:"btn primary", onclick:() => followUp("save", m)}, "احفظ المواعيد واللي يهمني"));
    if (src) acts.push(h("button",{class:"btn ghost", onclick:() => followUp("excel", m)}, "حوّل لـ Excel"));
    acts.push(h("button",{class:"btn ghost", onclick:() => copyText([d.title, d.answer, ...d.key_points.map(t => "• " + t)].join("\n"))}, "انسخ"));
    card.append(h("div",{class:"row"}, acts));
  } else if (d.type === "excel"){
    for (const sh of d.sheets){
      const head = h("tr",{}, sh.columns.map(c => h("th",{}, c)));
      const body = sh.rows.slice(0, 6).map(r => h("tr",{}, r.map(c => h("td",{}, c))));
      card.append(h("div",{}, h("h4",{}, `${sh.name}: ${sh.rows.length} صف × ${sh.columns.length} عمود`),
        h("div",{class:"xl-preview"}, h("table",{class:"xl"}, h("thead",{}, head), h("tbody",{}, body)))));
    }
    if (d.notes) card.append(h("div",{class:"warn"}, d.notes));
    card.append(h("div",{class:"row"}, h("button",{class:"btn primary", onclick:() => saveXlsx(d)}, "نزّل Excel")));
  } else {
    card.append(h("h3",{}, d.title), h("div",{class:"doc-text"}, d.text));
    if (d.notes) card.append(h("div",{class:"warn"}, d.notes));
    card.append(h("div",{class:"row"},
      h("button",{class:"btn primary", onclick:() => copyText(d.text)}, "انسخ"),
      h("button",{class:"btn ghost", onclick:() => downloadFile(`${d.title.replace(/[\\/:*?"<>|]/g, " ").slice(0, 60) || "nasem-text"}.txt`, d.text)}, "نزّل TXT")));
  }
  if (!src && d.type === "analysis") card.append(h("div",{class:"att-note"}, "لإجراء تاني على نفس الملف، أرفقه تاني."));
  return card;
}

async function followUp(action, m){
  let a = attachById.get(m.sourceMsg); if (!a || busy) return;
  if (a.kind === "audio" && m.doc && m.doc.transcript) a = {kind:"doc", name: a.name + " (نص)", text: m.doc.transcript};
  const label = (ATT_ACTIONS.find(x => x[0] === action) || [,""])[1];
  const userMsg = {id:uid(), role:"user", text: label, at: nowISO(), source:"text", attachment:{name: a.name, kind: a.kind}};
  S.messages.push(userMsg); attachById.set(userMsg.id, a);
  busy = true; render(); scrollDown();
  await processAttachment(action, a, "", userMsg.id);
}

/* ---------------- adaptation: learn how THIS user likes to be treated ----------------
   Only usage counters (hours, voice vs text, approvals, who comes up). No personality analysis.
   Nothing learned is applied silently: explicit requests apply at once, patterns become a
   suggestion the user accepts or dismisses, and everything is visible and editable in ذاكرتي. */
function noteMessage(text, source){
  const st = S.profile.stats;
  st.hours[new Date().getHours()]++;
  st[source === "voice" ? "voice" : "text"]++;
  st.lenSum += text.length; st.msgs++;
}

function suggestions(){
  const P = S.profile, st = P.stats, pr = P.prefs, out = [];
  const ok = key => !P.dismissed[key];
  const dc = st.decisions.approve_commitment, total = dc.y + dc.n;
  if (!pr.autoSelfReminders && ok("autoSelf") && ((total >= 3 && dc.n === 0) || (total >= 5 && dc.y / total >= 0.9)))
    out.push({key:"autoSelf", text:`وافقت على ${dc.y} من ${total} تذكيرات طلبتها لنفسك. أضيف تذكيراتك على طول من غير ما أسألك؟ (اقتراحاتي أنا هفضل أسألك عليها)`,
      apply(){ pr.autoSelfReminders = true; }, done:"هضيف تذكيراتك على طول"});
  const pv = st.decisions.proactive, pt = pv.y + pv.n;
  if (pr.proactive && ok("fewerProactive") && pv.n >= 3 && pv.y / pt < 0.3)
    out.push({key:"fewerProactive", text:`رفضت ${pv.n} من ${pt} اقتراحات من عندي. أبطّل أقترح حاجات من نفسي؟`,
      apply(){ pr.proactive = false; }, done:"مش هقترح من عندي"});
  if (pr.length === null && ok("short") && st.msgs >= 4 && st.lenSum / st.msgs < 40)
    out.push({key:"short", text:"رسايلك قصيرة ومباشرة. أخلي ردودي قصيرة زيها؟",
      apply(){ pr.length = "short"; }, done:"ردود أقصر"});
  const vt = st.voice + st.text;
  if (ok("tts") && !ttsOn && hasTTS && st.voice >= 5 && st.voice / vt >= 0.6)
    out.push({key:"tts", text:`${Math.round(100 * st.voice / vt)}% من كلامك بالصوت. أرد عليك بصوت كمان؟`,
      apply(){ ttsOn = true; ttsBtn.setAttribute("aria-pressed", "true"); try{ localStorage.setItem("nasem-demo-tts", "1"); }catch(e){} }, done:"هرد بصوت"});
  for (const [name, n] of Object.entries(st.people)){
    if (n >= 3 && !P.close.includes(name) && ok("close:" + name) && S.memories.some(m => m.active && m.entity === name))
      out.push({key:"close:" + name, text:`${name} بيتكرر كتير في كلامك. أعتبره من المقرّبين؟ (هيفيد لما نفعّل الإرسال التلقائي للمقرّبين)`,
        apply(){ P.close.push(name); }, done:`${name} من المقرّبين`});
  }
  return out;
}

    facts.push(`بتكلمني أكتر حوالين الساعة ${peak % 12 || 12} ${peak < 12 ? "الصبح" : "بالليل"}`);
    const vt = st.voice + st.text; if (vt) facts.push(`${Math.round(100 * st.voice / vt)}% من رسايلك بالصوت`);
  }
  const dc = st.decisions.approve_commitment, tot = dc.y + dc.n;
  if (tot) facts.push(`وافقت على ${dc.y} من ${tot} تذكيرات`);
  if (P.close.length) facts.push("المقرّبين: " + P.close.join("، "));
  if (facts.length) box.append(h("div",{class:"section-title"}, "من استخدامك"), h("ul",{class:"facts"}, facts.map(f => h("li",{}, f))));
  if (P.learnedLog.length) box.append(h("div",{class:"att-note"}, "آخر حاجة اتعلمتها: " + P.learnedLog.at(-1).what + " (" + P.learnedLog.at(-1).how + ")"));

function aiSettings(){
  const A = window.NASEM_APP; if (!A) return null;
  const cfg = A.getConfig(), save = () => A.setConfig(cfg);

    i.addEventListener("input", () => { onInput(i.value.trim()); save(); });
    return h("label",{class:"ai-field"}, h("span",{class:"pref-label"}, label), i);
  };
  const prov = (id, name, ph) => h("details",{class:"ai-prov", open: (id === cfg.primary && !cfg[id].key) ? true : null},
    h("summary",{}, name + (cfg[id].key ? "  ✓" : "")),
    field("المفتاح (API key)", cfg[id].key, v => { cfg[id].key = v; }, "password", ph),
    field("الموديل الأساسي", cfg[id].main, v => { cfg[id].main = v; }, "text", "اسم الموديل من موقع الشركة"),
    field("الموديل السريع (اختياري)", cfg[id].quick, v => { cfg[id].quick = v; }, "text", ""),
    id !== "anthropic" ? field("موديل الصور (للاستوديو، اختياري)", cfg[id].imageModel, v => { cfg[id].imageModel = v; }, "text", "اسم موديل الصور من موقع الشركة") : null,
    h("button",{class:"btn ghost", onclick: async e => {
      const b = e.currentTarget; b.textContent = "بجرّب…";
      try{ await A.test(id); b.textContent = "شغال ✓"; }
      catch(x){ b.textContent = x.code === "bad_key" ? "المفتاح مرفوض" : x.code === "no_key" ? "حط المفتاح الأول" : x.model ? `الموديل "${x.model}" مش شغال` : "مش شغال (" + (x.code || "خطأ") + ")"; }

/* ================= "how did it know?": cross-checks, promises, procedures, receipt, prescriptions, emergency ================= */
const EMERGENCY_RE = /طوارئ|إسعاف|اسعاف|نزيف|مش قادر (?:أ|ا)تنفس|حادث|أزمة قلبية|ازمة قلبية|جلطة|إغماء|اغماء|أغمى|اغمى|تسمم|حريق/;
const AR_MONTHS = {"يناير":1,"فبراير":2,"مارس":3,"أبريل":4,"ابريل":4,"إبريل":4,"مايو":5,"يونيو":6,"يوليو":7,"أغسطس":8,"اغسطس":8,"سبتمبر":9,"أكتوبر":10,"اكتوبر":10,"نوفمبر":11,"ديسمبر":12};
function parseDayMonth(v){
  const t = String(v || "").replace(/[٠-٩]/g, c => "٠١٢٣٤٥٦٧٨٩".indexOf(c));
  let m = t.match(/\d{4}-(\d{2})-(\d{2})/); if (m) return {d: +m[2], m: +m[1]};
  m = t.match(/(\d{1,2})\s*[\/\-]\s*(\d{1,2})/); if (m) return {d: +m[1], m: +m[2]};
  m = t.match(/(\d{1,2})\s*(?:من\s*)?(\S+)/); if (m){ const k = m[2].replace(/^ال/, ""); if (AR_MONTHS[k]) return {d: +m[1], m: AR_MONTHS[k]}; }
  return null;
}
function nextOccurrence(dm){
  const now = new Date(), today = new Date(now.toDateString());
  let d = new Date(now.getFullYear(), dm.m - 1, dm.d); if (d < today) d = new Date(now.getFullYear() + 1, dm.m - 1, dm.d); return d;
}
const TRAVEL_RE = /سفر|مسافر|هسافر|طيار|رحلة|الحج|العمرة|travel|flight|trip/i;
const MONEY_RE = /إيجار|ايجار|قسط|فاتورة|ادفع|دفع|مصاريف|تحويل/;

/* Local rules over data that only Nasem holds together. No AI call, nothing leaves the phone. */
function insights(){
  const out = [], now = new Date(), day = 864e5;
  const active = S.commitments.filter(c => c.status === "pending" && c.approved_at && c.due);
  const trips = active.filter(c => TRAVEL_RE.test(c.title + " " + (c.description || "")) && new Date(c.due) > now && new Date(c.due) - now < 200 * day);
  const passports = (S.documents || []).filter(d => d.type === "passport" && d.expiry);
  for (const t of trips){
    for (const pp of passports){
      const left = (new Date(pp.expiry) - new Date(t.due)) / day;
      if (left < 183) out.push({id:"pp" + t.id + pp.id, level: left < 0 ? "late" : "warn",
        text:`${t.title} ${fmtDay(t.due)}، و${pp.title} ${left < 0 ? "هيكون منتهي ساعتها" : "صلاحيته بعدها أقل من 6 شهور، ودول كتير بتشترط 6"}.`,
        action:["دليل التجديد", () => send(`أجدد ${pp.title} إزاي بسرعة وإيه الورق المطلوب؟`)]});
    }
    if (!passports.length) out.push({id:"np" + t.id, level:"info", text:`عندك ${t.title}. صوّر الباسبور واحفظه كمستند، وأنا أتابع صلاحيته قبل السفر.`});
  }
  for (const m of S.memories.filter(x => x.active && x.entity !== "user" && /birthday|anniversary|عيد/.test(x.key))){
    const dm = parseDayMonth(m.value); if (!dm) continue;
    const d = nextOccurrence(dm), days = Math.round((d - new Date(now.toDateString())) / day);
    if (days > 14) continue;
    const kind = /anniv/.test(m.key) ? "ذكرى" : "عيد ميلاد", clash = trips.find(t => dayKey(new Date(t.due)) === dayKey(d));
    out.push({id:"bd" + m.id + d.getFullYear(), level:"info",
      text: days === 0 ? `النهاردة ${kind} ${entityLabel(m.entity)}.` : `${kind} ${entityLabel(m.entity)} بعد ${days} يوم${clash ? `، ويومها عندك ${clash.title}` : ""}.`,
      action:["اقترح هدية", () => send(`اقترح هدية لـ ${entityLabel(m.entity)} على ذوقه`)]});
  }
  const dues = [];
  for (const c of active) if (MONEY_RE.test(c.title) && new Date(c.due) > now && new Date(c.due) - now < 35 * day) dues.push({what:c.title, at:new Date(c.due)});
  for (const g of (S.ledger ? S.ledger.gam3eyas : [])){ const gi = gamInfo(g); if (gi && gi.nextPay && gi.nextPay > now) dues.push({what:`قسط ${g.name}`, at:gi.nextPay}); }
  dues.sort((a, b) => a.at - b.at);
  for (const d0 of dues){
    const grp = dues.filter(x => x.at >= d0.at && x.at - d0.at <= 3 * day);
    if (grp.length >= 2){ out.push({id:"mc" + dayKey(d0.at), level:"warn", text:`مصاريف ورا بعض: ${grp.map(x => `${x.what} (${x.at.getDate()}/${x.at.getMonth() + 1})`).join(" + ")}.`}); break; }
  }
  const et = egyptTime();
  for (const c of active){
    const d = new Date(c.due); if (d < now || d - now > 2 * day) continue;
    const mg = dayKey(d) === dayKey(now) ? et.today.maghrib : dayKey(d) === dayKey(new Date(now.getTime() + day)) ? et.tomorrow.maghrib : null;
    if (mg && Math.abs(d - mg) <= 40 * 60e3) out.push({id:"mg" + c.id, level:"info", text:`${c.title} ${fmtTime(c.due)}، يعني وقت المغرب والزحمة. خد حسابك.`});
  }
  const upcoming = active.filter(c => new Date(c.due) > now).sort((a, b) => a.due.localeCompare(b.due));
  for (let i = 1; i < upcoming.length; i++)
    if (new Date(upcoming[i].due) - new Date(upcoming[i - 1].due) < 45 * 60e3)
      out.push({id:"ov" + upcoming[i].id, level:"warn", text:`تعارض: ${upcoming[i - 1].title} و${upcoming[i].title} في نفس الوقت تقريباً (${fmtDate(upcoming[i].due)}).`});
  for (const c of active){
    const d0 = new Date(c.due); if (d0 < now || d0 - now > 30 * day) continue;
    const hol = holidayOn(d0);
    if (hol) out.push({id:"hol" + c.id, level:"info", text:`${c.title} ${fmtDay(c.due)}، وده يوم ${hol.name}${hol.approx ? " (تقريبي)" : ""}. اتأكد إن المكان فاتح.`});
  }
  for (const d of (S.decisions || []).filter(x => x.status === "open" && new Date(x.review_at) <= now))
    out.push({id:"dr" + d.id, level:"info", text:`جه وقت مراجعة قرارك: "${d.chosen}". حصل اللي كنت متوقعه؟`, action:["راجعه", () => switchTab("tasks")]});
  for (const pr of S.promises.filter(x => x.direction === "they_promised" && x.status === "open" && x.due && new Date(x.due) < now))
    out.push({id:"pr" + pr.id, level:"warn", text:`${pr.person} وعدك: ${pr.what}، والميعاد عدّى.`,
      action:["أكتبله متابعة", () => send(`اكتبلي رسالة متابعة مهذبة لـ ${pr.person} بخصوص: ${pr.what}`)]});
  const hidden = S.profile.dismissed || {};
  return out.filter(x => !hidden["ins:" + x.id]);
}

/* Opening the dialer: works directly in the installed app. Inside a framed page (the demo in Claude)

function dialNumber(num){
  const framed = (() => { try{ return window.self !== window.top; }catch(e){ return true; } })();
  if (!framed){ window.location.href = "tel:" + num; return; }
  let opened = null;
  try{ opened = window.open("tel:" + num, "_blank"); }catch(e){}
  if (!opened){

    toast(`اتصل بـ ${num} من تليفونك دلوقتي. (الرقم اتنسخ)`);
  }
}

function parseStudio(kind, raw, p){

  if (!raw || typeof raw !== "object") throw outputError("not an object");
  if (kind === "write"){
    const variants = list(raw.variants, 3, x => x && str(x.text, 3000) ? {label: str(x.label, 60) || "نسخة", text: str(x.text, 3000)} : null);
    if (!variants.length) throw outputError("no variants");
    return {title: str(raw.title, 100) || "النص", variants, hashtags: list(raw.hashtags, 8, x => str(x, 40)), email: p.type === "email"};
  }
  if (kind === "cv"){

    const summary = str(raw.summary, 800); if (!summary && !exp.length) throw outputError("empty cv");

      education: list(raw.education, 5, x => x && str(x.degree, 160) ? {degree: str(x.degree, 160), org: str(x.org, 120), period: str(x.period, 60)} : null),

    primary: hex(colors.primary, "#1F7A8C"), bg: hex(colors.bg, "#F6F9FA"), area: p.area || "", hours: p.hours || "", whatsapp: p.whatsapp || ""};
}

async function runStudio(kind, params, {fromChat = false} = {}){
  if (!fromChat){
    if (busy || !ready) return;
    if (!S.consent){ openConsent(); return; }
    const first = params.brief || params.headline || params.name || params.target || "";
    S.messages.push({id:uid(), role:"user", text:`${STUDIO[kind].label}${first ? ": " + first : ""}`, at:nowISO(), source:"text"});
    busy = true; switchTab("chat"); render(); scrollDown();
  }
  const vault = makeVault(); let agent;
  try{
    const sample = await getSample();
    if (!sample){ const e = new Error("no sample"); e.code = "sampling_unavailable"; throw e; }
    abortCtl = new AbortController();
    const raw = vault.unmask(await sample.json(vault.mask(studioPrompt(kind, params)) + TOKEN_NOTE, {modelTier:"default", cache:false, signal: abortCtl.signal}));
    const spec = parseStudio(kind, raw, params);
    agent = {id:uid(), role:"agent", text: STUDIO[kind].done, at: nowISO(), studio:{kind, spec}};
    if (window.NASEM_APP) agent.provider = window.NASEM_APP.state.lastProvider;
    if (kind === "design") await makeDesignBase(agent);
    statBump("messages"); statBump("hidden", vault.size);
  }catch(e){
    const code = (e && e.code) || "llm_unavailable";
    if (code !== "cancelled") console.warn(e);
    agent = {id:uid(), role:"agent", text: code === "llm_output_invalid" ? "ما قدرتش أطلّع نتيجة كويسة. جرّب توضّح طلبك أكتر." : (FALLBACK[code] || FALLBACK.llm_unavailable), at: nowISO(), error: code};
  }
  S.messages.push(agent);
  busy = false; abortCtl = null; render(); scrollDown(); store.save();
  if (!agent.error) speak(agent.text);
}

async function makeDesignBase(agent){

}
function seeded(str){ let h = 2166136261; for (const ch of str) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296; }
function wrapLines(ctx, text, maxW){
  const words = String(text).split(/\s+/).filter(Boolean), lines = []; let cur = "";
  for (const w of words){ const t = cur ? cur + " " + w : w; if (ctx.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
async function composeDesign(msgId, spec){
  const key = msgId + "|" + spec.headline + "|" + spec.subline;
  if (designCache.has(key)) return designCache.get(key);
  const [W, H] = DESIGN_SIZE[spec.format];
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const ctx = c.getContext("2d"), base = designBase.get(msgId), rnd = seeded(spec.image_prompt + spec.format);
  try{ await document.fonts.load('700 64px "Readex Pro"'); }catch(e){}
  const FONT = '"Readex Pro", "IBM Plex Sans Arabic", Tahoma, Arial, sans-serif';
  if (spec.format === "logo"){
    ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, W, H);
    const r = W * 0.26, cx = W / 2, cy = H * 0.42;
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.closePath(); ctx.clip();
    if (base){ const s = Math.max((2 * r) / base.width, (2 * r) / base.height); ctx.drawImage(base, cx - base.width * s / 2, cy - base.height * s / 2, base.width * s, base.height * s); }
    else { const g = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r); g.addColorStop(0, spec.palette.accent); g.addColorStop(1, spec.palette.bg); ctx.fillStyle = g; ctx.fillRect(cx - r, cy - r, 2 * r, 2 * r);
      ctx.fillStyle = "#FFFFFF"; ctx.font = `700 ${Math.round(r * 1.1)}px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.direction = "rtl"; ctx.fillText((spec.headline || "ن").trim().charAt(0), cx, cy + r * 0.05); }
    ctx.restore();
    ctx.fillStyle = spec.palette.bg; ctx.textAlign = "center"; ctx.direction = "rtl"; ctx.textBaseline = "alphabetic";
    ctx.font = `700 ${Math.round(W * 0.085)}px ${FONT}`; ctx.fillText(spec.headline || "", W / 2, H * 0.82);
    if (spec.subline){ ctx.fillStyle = spec.palette.accent; ctx.font = `400 ${Math.round(W * 0.038)}px ${FONT}`; ctx.fillText(spec.subline, W / 2, H * 0.9); }
  } else {
    if (base){ const s = Math.max(W / base.width, H / base.height); ctx.drawImage(base, (W - base.width * s) / 2, (H - base.height * s) / 2, base.width * s, base.height * s); }
    else {
      const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, spec.palette.bg); g.addColorStop(1, spec.palette.accent); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      for (let i = 0; i < 7; i++){ ctx.globalAlpha = 0.08 + rnd() * 0.12; ctx.fillStyle = "#FFFFFF"; ctx.beginPath(); ctx.arc(rnd() * W, rnd() * H, (0.08 + rnd() * 0.35) * Math.max(W, H), 0, Math.PI * 2); ctx.fill(); }
      ctx.globalAlpha = 0.25; ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = W * 0.006;
      for (let k = 0; k < 3; k++){ ctx.beginPath(); const y0 = H * (0.25 + k * 0.12); ctx.moveTo(0, y0); for (let x = 0; x <= W; x += W / 40) ctx.lineTo(x, y0 + Math.sin(x / W * Math.PI * 2 + k) * H * 0.03); ctx.stroke(); }
      ctx.globalAlpha = 1;
    }
    const band = spec.area === "top" ? [0, H * 0.45] : spec.area === "center" ? [H * 0.3, H * 0.7] : [H * 0.55, H];
    const grad = ctx.createLinearGradient(0, band[0], 0, band[1]);
    const dark = "rgba(6,20,26,0.72)", clear = "rgba(6,20,26,0)";
    if (spec.area === "top"){ grad.addColorStop(0, dark); grad.addColorStop(1, clear); }
    else if (spec.area === "center"){ grad.addColorStop(0, clear); grad.addColorStop(0.5, dark); grad.addColorStop(1, clear); }
    else { grad.addColorStop(0, clear); grad.addColorStop(1, dark); }
    ctx.fillStyle = grad; ctx.fillRect(0, band[0], W, band[1] - band[0]);
    ctx.direction = "rtl"; ctx.textAlign = "center"; ctx.fillStyle = spec.palette.text || "#FFFFFF";
    let size = Math.round(Math.min(W, H) * 0.095), lines;
    do { ctx.font = `700 ${size}px ${FONT}`; lines = wrapLines(ctx, spec.headline, W * 0.84); size -= 4; } while (lines.length > 3 && size > 28);
    const lh = size * 1.35, subSize = Math.round(size * 0.48);
    const block = lines.length * lh + (spec.subline ? subSize * 1.8 : 0);
    let y = spec.area === "top" ? H * 0.1 + lh : spec.area === "center" ? H / 2 - block / 2 + lh * 0.8 : H * 0.9 - block + lh * 0.8;
    ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = size * 0.2;
    for (const ln of lines){ ctx.fillText(ln, W / 2, y); y += lh; }
    if (spec.subline){ ctx.font = `400 ${subSize}px ${FONT}`; ctx.globalAlpha = 0.92; ctx.fillText(spec.subline, W / 2, y + subSize * 0.4); ctx.globalAlpha = 1; }
    ctx.shadowBlur = 0;
  }
  const url = c.toDataURL("image/png"); designCache.set(key, url); return url;
}

/* ================= live call + share to Nasem ================= */
let cloudPending = false;
/* Call mode: listen -> think -> speak (Egyptian voice) -> listen again. Every turn goes through the
   normal chat path, so masking, approvals and memory work exactly like typing. */
let call = null;
function callAvailable(){ return !!SR && !micBlocked; }
function openCall(){
  if (!S.consent){ openConsent(); return; }
  if (!callAvailable()){
    sheet.replaceChildren(h("h2",{id:"sheetTitle"}, "مكالمة مع نسيم"),
      h("p",{}, window.NASEM_APP ? "المكالمة محتاجة إذن الميكروفون. اسمح بيه من إعدادات المتصفح لتطبيق نسيم وجرّب تاني." : "المكالمة بتشتغل في تطبيق نسيم المتثبّت، لأن ميكروفون الصفحة مقفول هنا. لحد كده: ميكروفون الكيبورد + زرار السماعة."),
      h("div",{class:"row"}, h("button",{class:"btn primary", onclick:closeSheet}, "تمام")));
    sheetBack.hidden = false; return;
  }
  unlockTTS();
  call = {state:"idle", lines:[], misses:0, active:true, partial:"", rec:null};
  renderCall(); callListen();
}
function callSpeaking(){ return cloudPending || (hasTTS && speechSynthesis.speaking) || !!(window.NASEM_APP && window.NASEM_APP.tts && window.NASEM_APP.tts.isPlaying && window.NASEM_APP.tts.isPlaying()); }
async function waitSpeechEnd(){
  await new Promise(r => setTimeout(r, 400));
  for (let i = 0; i < 240 && callSpeaking(); i++) await new Promise(r => setTimeout(r, 250));
}
function callListen(){
  if (!call || !call.active) return;
  call.state = "listening"; call.partial = ""; renderCall();
  let finalText = "", r;
  try{ r = new SR(); }catch(e){ endCall("الميكروفون مش متاح."); return; }
  r.lang = ttsPrefs.micLang || "ar-EG"; r.interimResults = true; r.maxAlternatives = 1; tryLocalSTT(r);
  r.onresult = ev => {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++){ const t = ev.results[i][0].transcript; if (ev.results[i].isFinal) finalText += t; else interim += t; }
    if (call){ call.partial = (finalText + interim).trim(); renderCall(); }
  };
  r.onerror = ev => { if (localSTTFailed(r, ev)) return; if (MIC_ERRORS[ev.error] === "blocked"){ blockMic(); endCall("الميكروفون اتقفل."); } };
  r.onend = async () => {
    if (!call || !call.active || call.rec !== r) return;
    call.rec = null;
    const t = (finalText || call.partial || "").trim();
    if (!t){ call.misses++; if (call.misses >= 3){ call.state = "paused"; renderCall(); return; } callListen(); return; }
    call.misses = 0; call.lines.push({who:"you", text:t}); call.state = "thinking"; renderCall();
    await send(t, "voice");
    if (!call || !call.active) return;
    const last = lastAgentMessage(); if (last) call.lines.push({who:"nasem", text:last.text});
    call.state = "speaking"; renderCall();
    await waitSpeechEnd();
    if (call && call.active && call.state === "speaking") callListen();
  };
  call.rec = r;
  try{ r.start(); }catch(e){ endCall("مش قادر أشغّل الميكروفون."); }
}
function interruptCall(){
  if (hasTTS) speechSynthesis.cancel();
  if (window.NASEM_APP && window.NASEM_APP.tts) window.NASEM_APP.tts.stop();

/* Everything due in the next 30 days, built on the phone. Sent to the server encrypted (see runtime). */
function reminderItems(){
  const out = [], now = Date.now(), horizon = now + 30 * 864e5;
  for (const c of S.commitments) if (c.status === "pending" && c.approved_at && c.due){
    const t = new Date(c.due).getTime(); if (t > now && t < horizon) out.push({id:"c" + c.id, at:t, title:c.title, body: c.description || fmtDate(c.due)});
  }
  for (const med of activeMeds()) for (let d = 0; d < 7; d++) for (const tm of med.times){
    const [H, M] = tm.split(":").map(Number), dt = new Date(); dt.setDate(dt.getDate() + d); dt.setHours(H, M, 0, 0);
    if (dt.getTime() > now && (!med.end || dt < new Date(med.end))) out.push({id:`m${med.id}-${d}-${tm}`, at: dt.getTime(), title:`الدوا: ${med.name}`, body:[med.strength, med.dose, med.instructions].filter(Boolean).join(" • ")});
  }
  for (const g of S.ledger.gam3eyas){
    const gi = gamInfo(g); if (!gi || !gi.nextPay) continue;
    const dt = new Date(gi.nextPay); dt.setDate(dt.getDate() - 1); dt.setHours(10, 0, 0, 0);
    if (dt.getTime() > now) out.push({id:"g" + g.id + dt.toDateString(), at: dt.getTime(), title:`قسط ${g.name} بكرة`, body: g.monthly ? fmtMoney(toNumber(g.monthly) || 0) : ""});
  }
  for (const p of S.promises) if (p.direction === "they_promised" && p.status === "open" && p.due){
    const t = new Date(p.due).getTime() + 2 * 3600e3; if (t > now && t < horizon) out.push({id:"p" + p.id, at:t, title:`${p.person} وعدك`, body:p.what});
  }
  return out.sort((a, b) => a.at - b.at).slice(0, 300);
}

async function saveCvDocx(sp){
  try{
    await loadLib("docx");
    const D = window.docx, rtl = sp.lang !== "en", align = D.AlignmentType.START;   // "start" = right in RTL paragraphs, left in LTR
    const L = rtl ? {sum:"نبذة", exp:"الخبرات", edu:"التعليم", skills:"المهارات", langs:"اللغات"} : {sum:"Summary", exp:"Experience", edu:"Education", skills:"Skills", langs:"Languages"};
    const run = (text, o = {}) => new D.TextRun({text: String(text || ""), font:"Arial", size: o.size || 22, bold: !!o.bold, color: o.color || "0E2733", rightToLeft: rtl});
    const P = (text, o = {}) => new D.Paragraph({bidirectional: rtl, alignment: align, spacing:{after: o.after ?? 80}, children:[run(text, o)]});
    const H = t => new D.Paragraph({bidirectional: rtl, alignment: align, spacing:{before:240, after:80},
      border:{bottom:{color:"1F7A8C", space:2, style: D.BorderStyle.SINGLE, size:8}}, children:[run(t, {bold:true, size:26, color:"1F7A8C"})]});
    const bullet = t => new D.Paragraph({bidirectional: rtl, alignment: align, bullet:{level:0}, children:[run(t)]});
    const kids = [P(sp.name || (rtl ? "[اسمك]" : "[Your name]"), {bold:true, size:40, after:40}), P(sp.headline || "", {color:"5B7280", after:160})];
    if (sp.summary) kids.push(H(L.sum), P(sp.summary));
    if (sp.experience.length){ kids.push(H(L.exp)); for (const x of sp.experience){ kids.push(P([x.title, x.org].filter(Boolean).join(" — ") + (x.period ? `  (${x.period})` : ""), {bold:true, after:40})); x.bullets.forEach(b => kids.push(bullet(b))); } }
    if (sp.education.length){ kids.push(H(L.edu)); for (const x of sp.education) kids.push(P([x.degree, x.org].filter(Boolean).join(" — ") + (x.period ? `  (${x.period})` : ""))); }
    if (sp.skills.length) kids.push(H(L.skills), P(sp.skills.join(" • ")));
    if (sp.languages.length) kids.push(H(L.langs), P(sp.languages.join(" • ")));
    const doc = new D.Document({sections:[{properties:{page:{margin:{top:900, bottom:900, left:900, right:900}}}, children: kids}]});
    await downloadFile(rtl ? "سيرة-ذاتية.docx" : "CV.docx", await D.Packer.toBlob(doc));
  }catch(e){ console.warn(e); toast("ما قدرتش أعمل ملف Word هنا."); }
}

function decisionContext(){

    .map(m => `${m.entity === "user" ? "user" : m.entity}.${m.key} = ${m.value}`).join("\n");
  const upcoming = S.commitments.filter(c => c.status === "pending" && c.approved_at && c.due && new Date(c.due) > new Date())
    .sort((a, b) => a.due.localeCompare(b.due)).slice(0, 15).map(c => `${localISO(new Date(c.due)).slice(0, 10)} ${c.title}`).join("\n");
  let money = "not shared (the user has not allowed storing financial information)";
  if (S.settings.sensitive){
    const lines = balances().map(b => b.net > 0 ? `${b.label} owes the user ${Math.round(b.net)} EGP` : `the user owes ${b.label} ${Math.round(-b.net)} EGP`)
      .concat(S.ledger.gam3eyas.map(g => `جمعية ${g.name}: ${g.monthly || "?"} per month`));
    money = lines.join("\n") || "nothing recorded";
  }
  const past = (S.decisions || []).filter(d => d.status === "reviewed").slice(-8)
    .map(d => `Question: "${d.question}". Chose: "${d.chosen}". Expected: ${d.expected || "-"}. Outcome: ${({better:"better than expected", same:"as expected", worse:"worse than expected"})[d.outcome] || "-"}. Lesson: ${d.lesson || "-"}`).join("\n");
  return {mem, upcoming, money, past};
}

function parseDecision(raw, q){
  const str = (v, max = 400) => typeof v === "string" && v.trim() ? v.trim().slice(0, max) : null;
  const list = (v, n, f) => Array.isArray(v) ? v.map(f).filter(Boolean).slice(0, n) : [];
  if (!raw || typeof raw !== "object") throw outputError("not an object");
  const options = list(raw.options, 4, o => o && str(o.name, 80) ? {name: str(o.name, 80), pros: list(o.pros, 4, x => str(x, 160)), cons: list(o.cons, 4, x => str(x, 160)), fits: str(o.fits_you, 260)} : null);
  if (options.length < 2) throw outputError("need at least two options");
  const days = [30, 60, 90].includes(+raw.review_after_days) ? +raw.review_after_days : 30;
  return {question: q, title: str(raw.title, 80) || "قرارك", options, factors: list(raw.key_factors, 4, x => str(x, 160)),
    questions: list(raw.questions, 4, x => str(x, 200)), past: str(raw.from_your_past, 300), next: str(raw.next_step, 240), days, chosenId: null};
}
async function runDecision(q, {fromChat = false} = {}){
  if (!fromChat){
    if (busy || !ready) return;
    if (!S.consent){ openConsent(); return; }
    S.messages.push({id:uid(), role:"user", text:q, at:nowISO(), source:"text"});
    busy = true; switchTab("chat"); render(); scrollDown();
  }
  const vault = makeVault(); let agent;
  try{
    const sample = await getSample();
    if (!sample){ const e = new Error("no sample"); e.code = "sampling_unavailable"; throw e; }
    abortCtl = new AbortController();
    const raw = vault.unmask(await sample.json(vault.mask(decisionPrompt(q)) + TOKEN_NOTE, {modelTier:"default", cache:false, signal: abortCtl.signal}));
    const spec = parseDecision(raw, q);
    agent = {id:uid(), role:"agent", text:"دي الاختيارات زي ما أنا شايفها من اللي أعرفه عنك. القرار ليك، ولما تختار هسجّله وأرجع أسألك حصل إيه.", at: nowISO(), decision: spec};
    if (window.NASEM_APP) agent.provider = window.NASEM_APP.state.lastProvider;
    statBump("messages"); statBump("hidden", vault.size);
  }catch(e){
    const code = (e && e.code) || "llm_unavailable";
    if (code !== "cancelled") console.warn(e);
    agent = {id:uid(), role:"agent", text: code === "llm_output_invalid" ? "ما قدرتش أرتّب الاختيارات كويس. احكيلي القرار بتفاصيل أكتر." : (FALLBACK[code] || FALLBACK.llm_unavailable), at: nowISO(), error: code};
  }
  S.messages.push(agent);
  busy = false; abortCtl = null; render(); scrollDown(); store.save();
  if (!agent.error) speak(agent.text);
}

      d.lesson ? h("span",{}, "الدرس: " + d.lesson) : null)))));
  return box;
}

/* ================= Egyptian official holidays + working days (computed on the phone) ================= */
function orthodoxEaster(y){   // Julian computus, shifted to the Gregorian calendar (valid 1900-2099)
  const a = y % 4, b = y % 7, c = y % 19, d = (19 * c + 15) % 30, e = (2 * a + 4 * b - d + 34) % 7, n = d + e + 114;
  const g = new Date(y, Math.floor(n / 31) - 1, (n % 31) + 1); g.setDate(g.getDate() + 13); return g;
}
const FIXED_HOLIDAYS = [[1,7,"عيد الميلاد المجيد"],[1,25,"ثورة 25 يناير وعيد الشرطة"],[4,25,"عيد تحرير سيناء"],[5,1,"عيد العمال"],[6,30,"ذكرى ثورة 30 يونيو"],[7,23,"عيد ثورة 23 يوليو"],[10,6,"عيد القوات المسلحة"]];
const HIJRI_HOLIDAYS = [[10,1,3,"عيد الفطر"],[12,9,4,"وقفة عرفات وعيد الأضحى"],[1,1,1,"رأس السنة الهجرية"],[3,12,1,"المولد النبوي"]];
let holCache = {key:""};
function holidaysFor(){
  const st = S.settings, key = dayKey(new Date()) + JSON.stringify([st.customHolidays || [], st.hiddenHolidays || []]);
  if (holCache.key === key) return holCache;
  const map = new Map(), start = new Date(new Date().toDateString()), hidden = new Set(st.hiddenHolidays || []);
  const add = (d, name, kind, approx) => { const k = dayKey(d); if (!hidden.has(k) && !map.has(k)) map.set(k, {date: new Date(d), name, kind, approx}); };
  let hijriLeft = 0, hijriName = "";
  for (let i = -5; i < 400; i++){
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    for (const [m, dd, name] of FIXED_HOLIDAYS) if (d.getMonth() + 1 === m && d.getDate() === dd) add(d, name, "fixed", false);
    const h2 = hijriDM(d);
    if (h2) for (const [m, dd, len, name] of HIJRI_HOLIDAYS) if (h2.m === m && h2.d === dd){ hijriLeft = len; hijriName = name; }
    if (hijriLeft > 0){ add(d, hijriName, "hijri", true); hijriLeft--; }
  }
  for (const y of [start.getFullYear(), start.getFullYear() + 1]){
    const sham = orthodoxEaster(y); sham.setDate(sham.getDate() + 1); add(sham, "شم النسيم", "coptic", false);
  }
  for (const c of st.customHolidays || []){ const d = new Date(c.date + "T00:00:00"); if (!isNaN(d)) add(d, c.name || "إجازة", "custom", false); }
  const list = [...map.values()].filter(x => x.date >= start).sort((a, b) => a.date - b.date);
  holCache = {key, map, list};
  return holCache;
}
function holidayOn(d){ return holidaysFor().map.get(dayKey(new Date(d))) || null; }
function isWeekend(d){ const w = new Date(d).getDay(); return w === 5 || (S.settings.weekend !== "fri" && w === 6); }
function workdaysBetween(from, to){
  let work = 0, off = 0; const hols = [];
  for (let d = new Date(from.toDateString()); d <= to; d.setDate(d.getDate() + 1)){
    const h0 = holidayOn(d);
    if (h0){ off++; hols.push(h0); } else if (isWeekend(d)) off++; else work++;
  }
  return {work, off, hols};
}
function groupHolidays(list){   // consecutive days with the same name -> one line
  const out = [];
  for (const x of list){
    const last = out[out.length - 1];
    if (last && last.name === x.name && (x.date - last.to) <= 864e5 + 3600e3) last.to = x.date;
    else out.push({name: x.name, from: x.date, to: x.date, approx: x.approx, kind: x.kind});
  }
  return out;
}
function holidayContext(){
  const soon = groupHolidays(holidaysFor().list.filter(x => x.date - new Date() < 90 * 864e5));
  const fmt = g => `${localISO(g.from).slice(0, 10)}${g.to > g.from ? " to " + localISO(g.to).slice(0, 10) : ""} ${g.name}${g.approx ? " (approximate)" : ""}`;
  return `<holidays_and_weekend>
weekend: ${S.settings.weekend === "fri" ? "Friday" : "Friday and Saturday"}
upcoming_holidays_next_90_days: ${soon.map(fmt).join("; ") || "none"}
</holidays_and_weekend>`;
}
function holidaysSection(){
  const st = S.settings, groups = groupHolidays(holidaysFor().list).slice(0, 14);
  const df = new Intl.DateTimeFormat("ar-EG", {day:"numeric", month:"long"});
  const box = h("div",{}, h("div",{class:"section-title"}, "الإجازات وأيام الشغل"));
  box.append(h("div",{class:"pref"}, h("div",{class:"pref-label"}, "الويك إند"),
    h("div",{class:"seg"}, [["fri","الجمعة بس"],["fri_sat","الجمعة والسبت"]].map(([v, t]) =>
      h("button",{"aria-pressed": String((st.weekend || "fri_sat") === v), onclick:() => { st.weekend = v; render(); store.save(); }}, t)))));
  box.append(h("div",{class:"list"}, groups.map(g => h("div",{class:"mem"},
    h("div",{class:"v"}, g.name),
    h("div",{class:"foot"}, h("span",{}, (g.to > g.from ? `${df.format(g.from)} – ${df.format(g.to)}` : df.format(g.from)) + (g.approx ? " • تقريبي" : "") + (g.kind === "custom" ? " • إضافتك" : "")),
      h("button",{class:"link-btn", onclick:() => {
        if (g.kind === "custom"){ st.customHolidays = (st.customHolidays || []).filter(c => !(c.name === g.name && new Date(c.date + "T00:00:00") >= g.from && new Date(c.date + "T00:00:00") <= g.to)); }
        else { const hid = new Set(st.hiddenHolidays || []); for (let d = new Date(g.from); d <= g.to; d.setDate(d.getDate() + 1)) hid.add(dayKey(d)); st.hiddenHolidays = [...hid]; }
        render(); store.save();
      }}, "شيلها"))))));
  const dIn = h("input",{class:"voice-select", type:"date", dir:"ltr"}), nIn = h("input",{class:"voice-select", placeholder:"مثلاً: إجازة الشركة"});
  box.append(h("details",{class:"ai-prov"}, h("summary",{}, "ضيف إجازة (شركتك أو قرار جديد)"),
    h("label",{class:"ai-field"}, h("span",{class:"pref-label"}, "اليوم"), dIn), h("label",{class:"ai-field"}, h("span",{class:"pref-label"}, "الاسم"), nIn),
    h("div",{class:"row"}, h("button",{class:"btn ghost", onclick:() => {
      if (!dIn.value){ toast("اختار اليوم."); return; }
      st.customHolidays = [...(st.customHolidays || []), {date: dIn.value, name: nIn.value.trim() || "إجازة"}];
      st.hiddenHolidays = (st.hiddenHolidays || []).filter(k => k !== dayKey(new Date(dIn.value + "T00:00:00")));
      toast("اتضافت."); render(); store.save();
    }}, "ضيف"))));
  const fIn = h("input",{class:"voice-select", type:"date", dir:"ltr"}), tIn = h("input",{class:"voice-select", type:"date", dir:"ltr"}), res = h("div",{class:"bottom", hidden:true});
  const today = new Date(); fIn.value = localISO(today).slice(0, 10);
  const end = new Date(today.getFullYear(), today.getMonth() + 1, 0); tIn.value = localISO(end).slice(0, 10);
  const calc = () => {
    if (!fIn.value || !tIn.value) return;
    const a = new Date(fIn.value + "T00:00:00"), b = new Date(tIn.value + "T00:00:00"); if (b < a){ res.hidden = false; res.textContent = "تاريخ النهاية قبل البداية."; return; }
    const r = workdaysBetween(a, b), names = [...new Set(r.hols.map(x => x.name))];
    res.hidden = false; res.textContent = `${r.work} يوم شغل، و${r.off} يوم إجازة${names.length ? " (منهم: " + names.join("، ") + ")" : ""}.`;
  };
  box.append(h("details",{class:"ai-prov"}, h("summary",{}, "احسب أيام الشغل"),
    h("div",{class:"row"}, h("label",{class:"ai-field"}, h("span",{class:"pref-label"}, "من"), fIn), h("label",{class:"ai-field"}, h("span",{class:"pref-label"}, "لحد"), tIn)),
    h("div",{class:"row"}, h("button",{class:"btn ghost", onclick: calc}, "احسب")), res,
    h("div",{class:"att-note"}, "الإجازات الهجرية تقريبية، والحكومة ممكن تنقل أي إجازة بقرار رسمي. لو حصل، عدّلها من هنا.")));
  return box;
}

let toastTimer;
function toast(t){ const el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2600); }
async function resetAll(){
  if (!confirm("هتتمسح كل الذكريات والالتزامات والموافقات. متأكد؟")) return;
  const consent = S.consent, settings = S.settings;
  if (window.NASEM_APP) await window.NASEM_APP.shredAll();   // new key: old encrypted data is gone for good
  S = {...blank(), consent, settings}; closeSheet(); render(); await store.save(); toast("اتمسح كل حاجة."); switchTab("chat");
}
