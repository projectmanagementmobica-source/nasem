[project]
name = "nasem-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=0.40",
    "uvicorn[standard]>=0.30",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "email-validator>=2.1",
    "openpyxl>=3.1",
    "weasyprint>=62",   # needs system libs: pango (see Dockerfile / README)
    "jinja2>=3.1",
    "cryptography>=42",
    "pywebpush>=2.0",
]

[project.optional-dependencies]
dev = ["mypy>=1.10", "ruff>=0.5", "pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "pypdf>=4"]

[tool.vercel]
entrypoint = "app.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]          # only the app is a package (migrations/tests/docker are not)

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.ttf", "*.json", "*.txt"]

[tool.mypy]
strict = true
plugins = []

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
